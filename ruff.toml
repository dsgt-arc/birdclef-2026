# Ruff configuration
# https://docs.astral.sh/ruff/configuration/

line-length = 88
target-version = "py310"

# Skip vendored upstream code — Kaggle notebooks/datasets/source we pull
# from external authors should remain bit-identical to the upstream version
# so it stays a faithful reference. We don't lint or reformat it.
extend-exclude = [
    "vendor/",
]

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
]

[lint.isort]
known-first-party = ["birdclef"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
