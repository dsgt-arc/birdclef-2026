[project]
name = "exp031-perch-kd-distillation"
version = "0.1.0"
description = "Exp 031: Perch v2 embedding-space knowledge distillation on v5j (Tucker recipe)"
authors = [
    {name = "Murilo Gustineli", email = "mgustineli3@gatech.edu"}
]
requires-python = ">=3.11"
dependencies = [
    # Core ML/DL — versions pinned to v5j-original era (Mar 31, 2026) to
    # eliminate cross-time drift. timm + huggingface-hub bumps were observed
    # to silently shift training output between v5j-original and exp 031
    # retrains; see analysis/notes/2026-05-10-v5j-drift-diagnostics-findings.md.
    # torch is pinned to the cu121 wheel range; SLURM scripts override with
    # --index-url https://download.pytorch.org/whl/cu121 to get the GPU build.
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "pytorch-lightning==2.6.1",
    "torchmetrics==1.9.0",
    "timm==1.0.26",
    "huggingface-hub<1.10",
    "wandb>=0.16.0",

    # Data handling
    "pyarrow>=15.0.0",
    "pandas>=2.0.0",

    # Audio processing
    "librosa>=0.10.0",
    "resampy>=0.4.0",
    "soundfile>=0.12.0",
    "nnAudio==0.3.4",

    # Perch v2 ONNX teacher (exp 031 KD branch)
    "onnxruntime-gpu>=1.18.0",

    # Logging
    "tensorboard>=2.14.0",

    # GPU monitoring
    "nvidia-ml-py>=12.0.0",

    # Utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef"]
