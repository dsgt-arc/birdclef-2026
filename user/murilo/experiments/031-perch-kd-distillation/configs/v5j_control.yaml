# Experiment 031, v5j-control: no-KD baseline trained ALONGSIDE v5j_kd.yaml
# in the exp 031 project, so we can read the KD lift on a single W&B
# dashboard rather than cross-referencing exp 030.
#
# This is structurally identical to 030/configs/v5j_control.yaml — same
# encoder, head, mel, data, training, mixup, optimizer, seed. Two purposes:
#   1. Live side-by-side comparison with v5j_kd.yaml in W&B project
#      birdclef-2026-exp031 (KD lift visible as the divergence between
#      the two cls_loss / val/auroc curves).
#   2. Re-verify that my KD-branch additions to sed_finetune.py left the
#      non-KD path bit-identical: this run should land at val/auroc ~0.851
#      and LB 0.896 ± 0.013 (matching exp 030 v5j_control_v2).
#
# `use_perch_distill` is absent (defaults to False) — KD code path NOT
# taken. mixup_mode and raw_waveform_mixup are made explicit only for
# hygiene; they're the same defaults v5j-original used implicitly.

run_name: "2026-exp031-v5j-control"

encoder:
  type: "efficientnet"
  model_name: "hgnetv2_b0.ssld_stage2_ft_in1k"
  pretrained: true
  embed_dim: 1024

sed_head:
  type: "lse_head"
  hidden_dim: 1024
  dropout: 0.5
  gem_p: 3.0
  lse_temperature: 1.0
  freq_pool: "mean"

mel:
  n_fft: 2048
  hop_length: 313
  n_mels: 256
  fmax: null
  top_db: 80.0
  norm_type: "amplitude_to_db"
  gpu: true

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 5.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 8
  soundscape_test_files: 0
  seed: 42

training:
  max_epochs: 20
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 0
  precision: "16-mixed"
  accumulate_grad_batches: 1
  clipwise_weight: 1.0
  framewise_weight: 0.0
  blend_clip: 1.0
  blend_frame: 0.0
  loss_type: "bce"
  # v5j-original mixup recipe — explicit defaults for hygiene.
  mixup_prob: 1.0
  mixup_alpha: 1.0
  mixup_warmup_epochs: 5
  mixup_theta: 0.8
  mixup_per_sample: true
  mixup_mode: "interpolate"
  raw_waveform_mixup: false
  scheduler_type: "one_cycle"
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 4.0
  # Note: use_perch_distill omitted -> defaults to False -> KD branch OFF.

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 999
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp031"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
