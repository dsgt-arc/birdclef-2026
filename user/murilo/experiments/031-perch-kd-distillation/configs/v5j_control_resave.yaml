# Experiment 031, v5j-control-resave: same recipe as v5j_control.yaml, but
# with `save_top_k: -1` so EVERY epoch checkpoint is preserved. Pairs with
# v5j_kd_resave.yaml. Purpose:
#   1. Get ep 19 weights for the best-vs-last LB diagnostic. v5j-original
#      (LB 0.906) was best-by-val ep 19. The original v5j_control run here
#      (LB 0.896) was best-by-val ep 15; `last.ckpt` was bit-identical to
#      it. Whether ep 19 weights recover 0.906 on the new codebase isolates
#      ckpt-selection sensitivity from real codebase drift.
#   2. Sanity check: this config re-running deterministically should
#      reproduce the original v5j_control offline metrics bit-identically
#      at every epoch (seed_everything + Trainer(deterministic=True)).
#
# Disk cost: 20 epochs × ~55 MB = ~1.1 GB. Scratch storage is fine.

run_name: "2026-exp031-v5j-control-resave"

encoder:
  type: "efficientnet"
  model_name: "hgnetv2_b0.ssld_stage2_ft_in1k"
  pretrained: true
  embed_dim: 1024

sed_head:
  type: "lse_head"
  hidden_dim: 1024
  dropout: 0.5
  gem_p: 3.0
  lse_temperature: 1.0
  freq_pool: "mean"

mel:
  n_fft: 2048
  hop_length: 313
  n_mels: 256
  fmax: null
  top_db: 80.0
  norm_type: "amplitude_to_db"
  gpu: true

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 5.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 8
  soundscape_test_files: 0
  seed: 42

training:
  max_epochs: 20
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 0
  precision: "16-mixed"
  accumulate_grad_batches: 1
  clipwise_weight: 1.0
  framewise_weight: 0.0
  blend_clip: 1.0
  blend_frame: 0.0
  loss_type: "bce"
  mixup_prob: 1.0
  mixup_alpha: 1.0
  mixup_warmup_epochs: 5
  mixup_theta: 0.8
  mixup_per_sample: true
  mixup_mode: "interpolate"
  raw_waveform_mixup: false
  scheduler_type: "one_cycle"
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 4.0
  # use_perch_distill omitted -> defaults to False -> KD branch OFF.

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    # save_top_k: -1 saves ALL epochs (one per validation epoch). Replaces
    # the previous save_top_k: 1 + save_last: true combo.
    save_top_k: -1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 999
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp031"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
