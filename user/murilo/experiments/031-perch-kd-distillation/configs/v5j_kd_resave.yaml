# Experiment 031, v5j-kd-resave: same recipe as v5j_kd.yaml, but with
# `save_top_k: -1` so EVERY epoch checkpoint is preserved. This addresses
# the post-hoc finding (2026-05-10) that the original v5j_kd run only
# saved best-by-val ep 17; `last.ckpt` was bit-identical to it (Lightning's
# `save_last: true` mirrors best under `save_top_k: 1`, NOT the literal
# final epoch). Without ep 19 weights, the best-vs-last diagnostic that
# v5j-original (LB 0.906, best-by-val ep 19) implies cannot be tested.
#
# All other recipe parameters are identical to v5j_kd.yaml. Training is
# deterministic (seed_everything + Trainer(deterministic=True)), so this
# rerun will produce bit-identical weights at every epoch — the original
# v5j_kd ep 17 weights will appear here as `best-epochepoch=17.ckpt` (or
# similarly-named per-epoch file), and ep 19 weights become available as
# `best-epochepoch=19.ckpt` (under save_top_k=-1, every epoch is "saved",
# not "kept-as-best", so naming may differ — adjust export wrappers if so).
#
# Disk cost: 20 epochs × ~75 MB = ~1.5 GB. Scratch storage is fine.

run_name: "2026-exp031-v5j-kd-resave"

encoder:
  type: "efficientnet"
  model_name: "hgnetv2_b0.ssld_stage2_ft_in1k"
  pretrained: true
  embed_dim: 1024

sed_head:
  type: "lse_head"
  hidden_dim: 1024
  dropout: 0.5
  gem_p: 3.0
  lse_temperature: 1.0
  freq_pool: "mean"

mel:
  n_fft: 2048
  hop_length: 313
  n_mels: 256
  fmax: null
  top_db: 80.0
  norm_type: "amplitude_to_db"
  gpu: true

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 5.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 8
  soundscape_test_files: 0
  seed: 42

training:
  max_epochs: 20
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 0
  precision: "16-mixed"
  accumulate_grad_batches: 1
  clipwise_weight: 1.0
  framewise_weight: 0.0
  blend_clip: 1.0
  blend_frame: 0.0
  loss_type: "bce"
  mixup_prob: 1.0
  mixup_alpha: 1.0
  mixup_warmup_epochs: 5
  mixup_theta: 0.8
  mixup_per_sample: true
  mixup_mode: "interpolate"
  raw_waveform_mixup: false
  scheduler_type: "one_cycle"
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 4.0
  use_perch_distill: true
  perch_onnx_path: "vendor/kaggle/datasets/perch-v2-no-dft-onnx/perch_v2_no_dft.onnx"
  perch_embed_dim: 1536
  alpha_distill: 1.0

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    # save_top_k: -1 saves ALL epochs (one per validation epoch). Replaces
    # the previous save_top_k: 1 + save_last: true combo, which only saved
    # the best-by-val ckpt and an alias of it (NOT the literal final epoch).
    save_top_k: -1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 999
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp031"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
