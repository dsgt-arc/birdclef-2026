# Experiment 003: ViT-Small with ImageNet pretrained weights
#
# ~22M params, pretrained initialization, shorter schedule

run_name: "vit-small-imagenet"

model:
  model_name: "vit_small_patch16_224.augreg_in21k_ft_in1k"
  img_size: [128, 500]  # (n_mels, target_frames)
  pretrained: true
  drop_rate: 0.0

data:
  dataset_name: "HSN"
  sample_rate: 32000
  target_duration: 5.0
  n_mels: 128
  frame_shift_ms: 10
  target_frames: 500
  batch_size: 32
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  norm_mean: -4.268
  norm_std: 4.569

training:
  max_epochs: 50
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 1.0
  precision: "16-mixed"
  accumulate_grad_batches: 1

callbacks:
  model_checkpoint:
    monitor: "val/cmap"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/cmap"
    mode: "max"
    patience: 10
    min_delta: 0.001

logging:
  entity: "dsgt-arc"
  project: "birdset-model-training"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
