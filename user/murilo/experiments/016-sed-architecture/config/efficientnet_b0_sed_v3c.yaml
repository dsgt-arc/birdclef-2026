# Experiment 016 v3c: Standard CE loss (no label smoothing)
#
# Single variable change from v1: loss_type soft_ce → ce with label_smoothing=0.0
# Uses standard F.cross_entropy with argmax of multi-hot as target class.
# Everything else identical to v1.
#
# Competitor: "CrossEntropyLoss on clipwise and framewise max"
# v1 baseline: 0.795 LB (0.823 with post-processing)

run_name: "2026-effnet-b0-sed-v3c"

encoder:
  type: "efficientnet"
  model_name: "efficientnet_b0"
  pretrained: true
  embed_dim: 320

sed_head:
  hidden_dim: 512
  dropout: 0.5
  gem_p: 3.0

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 10.0
  batch_size: 128
  num_workers: 12
  val_fraction: 0.1
  test_fraction: 0.1
  soundscape_val_files: 8
  soundscape_test_files: 8
  seed: 42

training:
  max_epochs: 40
  lr: 1.0e-4
  head_lr: 1.0e-3
  weight_decay: 0.01
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 1.0
  precision: "16-mixed"
  accumulate_grad_batches: 2
  clipwise_weight: 0.5
  framewise_weight: 0.5
  blend_clip: 0.75
  blend_frame: 0.25
  mixup_prob: 0.5
  mixup_alpha: 0.5
  loss_type: "ce"              # Changed: standard CE (was: soft_ce)
  label_smoothing: 0.0         # Changed: no smoothing (was: default 0.05)

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 10
    min_delta: 0.001

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-sed-architecture"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
