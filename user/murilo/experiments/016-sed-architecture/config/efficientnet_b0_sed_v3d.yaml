# Experiment 016 v3d: EfficientNet V2 B0 (correct model architecture)
#
# Single variable change from v1: efficientnet_b0 (V1) → tf_efficientnetv2_b0.in1k (V2)
# Everything else identical to v1.
#
# Discussion post author (0.889 LB) used "EfficientNetv2_b0" (Keras EfficientNetV2).
# The 0.908 commenter said "SED EfficientNet B0" (V1 or V2 unclear).
# V2 has Fused-MBConv blocks, 5.6M params (vs V1's 3.6M), different channel widths.
# Source: https://www.kaggle.com/competitions/birdclef-2026/discussion/683791
#
# v1 baseline: 0.795 LB (0.823 with post-processing)

run_name: "2026-effnet-b0-sed-v3d"

encoder:
  type: "efficientnet"
  model_name: "tf_efficientnetv2_b0.in1k"   # Changed: EfficientNet V2 B0
  pretrained: true
  embed_dim: 192                              # V2 last stage = 192 (V1 was 320)

sed_head:
  hidden_dim: 512
  dropout: 0.5
  gem_p: 3.0

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 10.0
  batch_size: 128
  num_workers: 12
  val_fraction: 0.1
  test_fraction: 0.1
  soundscape_val_files: 8
  soundscape_test_files: 8
  seed: 42

training:
  max_epochs: 40
  lr: 1.0e-4
  head_lr: 1.0e-3
  weight_decay: 0.01
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 1.0
  precision: "16-mixed"
  accumulate_grad_batches: 2
  clipwise_weight: 0.5
  framewise_weight: 0.5
  blend_clip: 0.75
  blend_frame: 0.25
  mixup_prob: 0.5
  mixup_alpha: 0.5

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 10
    min_delta: 0.001

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-sed-architecture"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
