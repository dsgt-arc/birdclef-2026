# Experiment 019, v5h: v5g + n_fft=4096 (high-res mel)
#
# Single change from v5g: n_fft 2048→4096 for finer frequency resolution.
# n_fft=4096 was our biggest lever in exp 017 (+0.030 LB on EfficientNet).
# win_length stays at 626 (unchanged from ttahara — controls temporal resolution).
# Resize to 256x256 normalizes the different time-frame count from higher n_fft.
#
# Hypothesis: higher frequency resolution helps distinguish insect sonotypes
# and overlapping bird calls, while resize absorbs the frame count change.

run_name: "2026-hgnet-b0-sed-v5h"

encoder:
  type: "efficientnet"
  model_name: "hgnetv2_b0.ssld_stage2_ft_in1k"
  pretrained: true
  embed_dim: 1024

sed_head:
  type: "lse_head"
  hidden_dim: 1024
  dropout: 0.5
  gem_p: 3.0
  lse_temperature: 1.0
  freq_pool: "mean"

mel:
  type: "ttahara"
  n_fft: 4096              # CHANGED: 2048→4096 (7.8 Hz bins vs 15.6 Hz)
  win_length: 626           # unchanged from ttahara
  hop_length: 313           # unchanged
  f_min: 20
  n_mels: 256
  top_db: 80.0
  target_shape: [256, 256]  # resize absorbs different frame count
  gpu: true

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 5.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 8
  soundscape_test_files: 0
  seed: 42

training:
  max_epochs: 20
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 0
  precision: "16-mixed"
  accumulate_grad_batches: 1
  clipwise_weight: 1.0
  framewise_weight: 0.0
  blend_clip: 1.0
  blend_frame: 0.0
  loss_type: "bce"
  mixup_prob: 1.0
  mixup_alpha: 1.0
  mixup_warmup_epochs: 5
  mixup_theta: 0.8
  mixup_per_sample: true
  scheduler_type: "one_cycle"
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 4.0

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 999
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp019"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
