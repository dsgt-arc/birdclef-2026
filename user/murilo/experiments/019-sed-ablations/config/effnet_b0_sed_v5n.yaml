# Experiment 019, v5n: EfficientNet-B0 + v5j recipe (NO projection)
#
# Control for v5m: identical config but without the 1x1 Conv2d projection.
# Isolates the projection layer's contribution from the mel pipeline change.
#
# v5n vs v5m: removes projection_dim, reduces hidden_dim to 320
#   → if v5n ≈ v5m (0.873): projection doesn't matter, mel pipeline is the gain
#   → if v5n < v5m: projection (embed_dim 320→1024) is doing real work
#
# v5n vs v5f (0.855 LB): same backbone + no projection, different mel pipeline
#   → if v5n > v5f: NNAudio+AmplitudeToDB mel is better than ttahara+resize
#   → if v5n ≈ v5f: mel pipeline doesn't matter for EfficientNet
#
# Together, v5f/v5m/v5n/v5j form a 2×2 grid isolating mel vs projection:
#
#   |              | ttahara mel (v5f) | v5j mel (NNAudio+AmpToDB) |
#   |--------------|-------------------|---------------------------|
#   | No projection| v5f (0.866/0.855) | v5n (this run)            |
#   | + projection | (not tested)      | v5m (0.873/pending)       |
#   | HGNet native | v5g (0.872/0.892) | v5j (0.874/0.906)         |

run_name: "2026-effnet-b0-sed-v5n"

encoder:
  type: "efficientnet"
  model_name: "efficientnet_b0"
  pretrained: true
  embed_dim: 320

sed_head:
  type: "lse_head"
  hidden_dim: 320
  dropout: 0.5
  gem_p: 3.0
  lse_temperature: 1.0
  freq_pool: "mean"

mel:
  # Same as v5j/v5m: NNAudio mel with AmplitudeToDB norm (no resize)
  n_fft: 2048
  hop_length: 313
  n_mels: 256
  fmax: null
  top_db: 80.0
  norm_type: "amplitude_to_db"
  gpu: true

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 5.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 8
  soundscape_test_files: 0
  seed: 42

training:
  max_epochs: 20
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 0
  precision: "16-mixed"
  accumulate_grad_batches: 1
  clipwise_weight: 1.0
  framewise_weight: 0.0
  blend_clip: 1.0
  blend_frame: 0.0
  loss_type: "bce"
  mixup_prob: 1.0
  mixup_alpha: 1.0
  mixup_warmup_epochs: 5
  mixup_theta: 0.8
  mixup_per_sample: true
  scheduler_type: "one_cycle"
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 4.0

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 999
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp019"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
