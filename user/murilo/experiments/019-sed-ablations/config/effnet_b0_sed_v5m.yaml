# Experiment 019, v5m: EfficientNet-B0 + projection to 1024 + v5j recipe
#
# Tests the embed_dim hypothesis: is HGNet's 1024-dim feature map the reason
# it outperforms EfficientNet (320-dim)? If so, adding a learned 1x1 conv
# projection (320 → 1024) before the SED head should close much of the gap.
#
# Compared to v5j (HGNet, 0.906 LB):
#   - Backbone: efficientnet_b0 (320 native) instead of hgnetv2_b0 (1024 native)
#   - Added: projection_dim=1024 (1x1 Conv2d after backbone)
#   - Everything else identical: NNAudio mel, AmplitudeToDB, LSEHead, etc.
#
# Compared to v5f (EfficientNet + ttahara, 0.855 LB):
#   - Added: projection_dim=1024
#   - Mel: NNAudio+AmplitudeToDB instead of ttahara+resize (matching v5j)
#   - hidden_dim: 1024 instead of 320
#
# If v5m ≈ v5j (0.906): embed_dim is the bottleneck, EfficientNet is fine.
# If v5m ≈ v5f (0.855): embed_dim isn't the issue, HGNet architecture matters.
# If v5m is between: embed_dim helps but isn't the whole story.

run_name: "2026-effnet-b0-sed-v5m"

encoder:
  type: "efficientnet"
  model_name: "efficientnet_b0"
  pretrained: true
  embed_dim: 320
  projection_dim: 1024

sed_head:
  type: "lse_head"
  hidden_dim: 1024
  dropout: 0.5
  gem_p: 3.0
  lse_temperature: 1.0
  freq_pool: "mean"

mel:
  # Same as v5j: NNAudio mel with AmplitudeToDB norm (no resize)
  n_fft: 2048
  hop_length: 313
  n_mels: 256
  fmax: null
  top_db: 80.0
  norm_type: "amplitude_to_db"
  gpu: true

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 5.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 8
  soundscape_test_files: 0
  seed: 42

training:
  max_epochs: 20
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 0
  precision: "16-mixed"
  accumulate_grad_batches: 1
  clipwise_weight: 1.0
  framewise_weight: 0.0
  blend_clip: 1.0
  blend_frame: 0.0
  loss_type: "bce"
  mixup_prob: 1.0
  mixup_alpha: 1.0
  mixup_warmup_epochs: 5
  mixup_theta: 0.8
  mixup_per_sample: true
  scheduler_type: "one_cycle"
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 4.0

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 999
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp019"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
