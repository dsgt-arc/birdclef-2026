# Experiment 025, Phase C: Mario-style waveform mixing with pseudo-labels
# v5j baseline recipe + pseudo-label waveform mixing
#
# Only changes from v5j baseline:
#   1. Added pseudo_label_mix section under data (PL audio mixed into focal waveforms)
#   2. run_name updated for Phase C
# Everything else identical: HGNetV2-B0, LSEHead, BCE, 5s, 20ep, OneCycleLR
#
# Reference: Mario Lasseck, BirdCLEF 2024 2nd place (+8% from iterative PL mixing)
#
# Usage:
#   cd user/murilo/experiments/025-iter-pseudo-labeling
#   bash sbatch/run.sh configs/v3_waveform_mix.yaml --fold 0
#   bash sbatch/run.sh configs/v3_waveform_mix.yaml --fold 0 --fast-dev-run

run_name: "2026-exp025-v3-waveform-mix"

encoder:
  type: "efficientnet"
  model_name: "hgnetv2_b0.ssld_stage2_ft_in1k"
  pretrained: true
  embed_dim: 1024

sed_head:
  type: "lse_head"
  hidden_dim: 1024
  dropout: 0.5
  gem_p: 3.0
  lse_temperature: 1.0
  freq_pool: "mean"

mel:
  n_fft: 2048
  hop_length: 313
  n_mels: 256
  fmax: null
  top_db: 80.0
  norm_type: "amplitude_to_db"
  gpu: true

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 5.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 8
  soundscape_test_files: 0
  seed: 42
  # Phase C: Waveform mixing (Mario Lasseck style)
  # 30% of focal samples get overlaid with a random PL soundscape segment
  # Amplitude factors: 10^uniform(-0.5, 0.1) = [0.32x, 1.26x] per waveform
  # Labels: max(focal_label, pl_soft_labels)
  pseudo_label_mix:
    path: "/storage/project/ps-clef2026_birdclef-0/shared/pseudo-labels/birdclef-2026/v1/pseudo_labels.parquet"
    mix_chance: 0.30
    amp_exp_min: -0.5
    amp_exp_max: 0.1

training:
  max_epochs: 20
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 0
  precision: "16-mixed"
  accumulate_grad_batches: 1
  clipwise_weight: 1.0
  framewise_weight: 0.0
  blend_clip: 1.0
  blend_frame: 0.0
  loss_type: "bce"
  mixup_prob: 1.0
  mixup_alpha: 1.0
  mixup_warmup_epochs: 5
  mixup_theta: 0.8
  mixup_per_sample: true
  scheduler_type: "one_cycle"
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 4.0

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 999
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp025"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
