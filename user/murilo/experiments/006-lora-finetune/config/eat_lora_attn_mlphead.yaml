# Experiment 006: EAT LoRA — Attention + MLP Head (Ablation)
#
# LoRA on attention layers (qkv, proj) + MLP classification head (512 hidden).
# Same LoRA as primary but with MLP head for fair comparison with Exp 005 finetune.
# ~442K LoRA params + ~530K head params = ~972K trainable (~1.1% of model).

run_name: "eat-lora-attn-mlphead"

encoder:
  type: "eat"
  model_name: "worstchan/EAT-base_epoch30_pretrain"
  embed_dim: 768
  target_length: 512  # 5s at 16kHz with 10ms hop

lora:
  rank: 8
  alpha: 16
  dropout: 0.1
  target_modules: ["qkv", "proj"]

data:
  data_dir: "~/ps-clef2026_birdclef-0/data/birdclef-2025"
  sample_rate: 16000
  chunk_duration: 5.0
  batch_size: 32
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.1
  seed: 42

training:
  max_epochs: 50
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_epochs: 5
  threshold: 0.5
  hidden_dim: 512              # MLP head with hidden layer
  dropout: 0.1
  grad_clip_val: 1.0
  precision: "16-mixed"
  accumulate_grad_batches: 8   # effective batch_size = 32 * 8 = 256

callbacks:
  model_checkpoint:
    monitor: "val/cmap"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/cmap"
    mode: "max"
    patience: 10
    min_delta: 0.001

logging:
  entity: "dsgt-arc"
  project: "birdclef-lora-finetune"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
