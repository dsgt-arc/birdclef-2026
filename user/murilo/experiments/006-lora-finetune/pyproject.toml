[project]
name = "lora-finetune"
version = "0.1.0"
description = "Exp 006: LoRA fine-tuning EAT on BirdCLEF 2025"
authors = [
    {name = "Murilo Gustineli", email = "mgustineli3@gatech.edu"}
]
requires-python = ">=3.11"
dependencies = [
    # Core ML/DL
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "torchmetrics>=1.0.0",
    "timm>=0.9.0",
    "wandb>=0.16.0",
    "transformers>=4.30.0",

    # PEFT (LoRA)
    "peft>=0.7.0",

    # Data handling
    "datasets==3.6.0",
    "pyarrow>=15.0.0",
    "polars>=0.19.0",
    "pandas>=2.0.0",

    # Audio processing
    "librosa>=0.10.0",
    "resampy>=0.4.0",
    "soundfile>=0.12.0",
    "nnAudio>=0.3",

    # Logging
    "tensorboard>=2.14.0",

    # GPU monitoring
    "nvidia-ml-py>=12.0.0",

    # Utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",

    # EDA / Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # Kaggle (for data download)
    "kaggle>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "pytest>=7.0.0",
]
adapters = [
    "adapters>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef"]
