[project]
name = "birdclef"
version = "0.1.0"
description = "BirdSet bioacoustics model benchmarking"
authors = [
    {name = "Murilo Gustineli", email = "mgustineli3@gatech.edu"}
]
requires-python = ">=3.11"
dependencies = [
    # Core ML/DL
    "torch>=2.0.0",
    "torchaudio>=2.0.0",     # Required by BirdSet models
    "torchvision>=0.15.0",   # Required by BirdSet models
    "pytorch-lightning>=2.0.0",
    "torchmetrics>=1.0.0",
    "transformers>=4.30.0",  # Required by BirdSet models (Hugging Face transformers)
    "tensorflow==2.17",      # For Perch and other TF-based models
    "tensorflow-hub",        # TensorFlow Hub for pretrained models
    "numpy>=1.24.0",
    "timm>=0.9.0",           # Vision Transformer models
    "wandb>=0.16.0",         # Weights & Biases logging
    "einops>=0.7.0",         # Tensor operations (for MAE)

    # Data handling
    "datasets==3.6.0",   # Upgraded to 3.6.0 for trust_remote_code support (required by BirdSet)
    "pyarrow>=15.0.0",   # Required by `datasets` for full feature support
    "polars>=0.19.0",    # Fast dataframes (preferred over pandas)
    "pandas>=2.0.0",     # Fallback if needed

    # Audio processing
    "librosa>=0.10.0",
    "resampy>=0.4.0",    # Required by librosa for resampling
    "soundfile>=0.12.0",
    "audioread>=3.0.0",

    # Bioacoustics models
    "bioacoustics-model-zoo",
    "opensoundscape>=0.10.0",
    "ai-edge-litert>=1.0.0",  # TensorFlow Lite for BirdNET

    # Machine learning
    "scikit-learn>=1.3.0",

    # Utilities
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",     # CLI framework
    "rich>=13.0.0",     # Beautiful terminal output
    "python-dotenv>=1.0.0",  # Load .env files

    # Testing (required for pytest configuration)
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",  # Required by pytest.ini addopts

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
    "pre-commit>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef"]

[tool.uv.sources]
bioacoustics-model-zoo = { git = "https://github.com/kitzeslab/bioacoustics-model-zoo.git", branch = "main" }
