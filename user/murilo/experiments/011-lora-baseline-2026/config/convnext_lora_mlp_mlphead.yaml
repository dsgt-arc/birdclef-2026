# Experiment 011: ConvNeXt-Base LoRA — MLP + MLP Head (2026 Baseline)
#
# Same architecture as Exp 007 convnext_lora_mlp_mlphead, retrained on BirdCLEF 2026 focal data.
# LoRA on MLP layers (fc1, fc2) + MLP classification head (512 hidden).

run_name: "2026-convnext-lora-mlp-mlphead"

encoder:
  type: "convnext"
  model_name: "convnext_base.fb_in22k_ft_in1k"
  embed_dim: 1024
  pretrained: true

lora:
  rank: 8
  alpha: 16
  dropout: 0.1
  target_modules: ["fc1", "fc2"]

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  chunk_duration: 5.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.1
  seed: 42

training:
  max_epochs: 50
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_epochs: 5
  threshold: 0.5
  hidden_dim: 512              # MLP head: 1024 -> 512 -> num_classes
  dropout: 0.1
  grad_clip_val: 1.0
  precision: "16-mixed"
  accumulate_grad_batches: 4   # effective batch_size = 64 * 4 = 256

callbacks:
  model_checkpoint:
    monitor: "val/cmap"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/cmap"
    mode: "max"
    patience: 10
    min_delta: 0.001

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-lora-finetune"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
