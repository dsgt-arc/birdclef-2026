# Experiment 011: ProtoCLR LoRA — Attention (2026 Baseline)
#
# Same architecture as Exp 009 protoclr_lora_attn, retrained on BirdCLEF 2026 focal data.
# LoRA on attention layers (proj_q, proj_k, proj_v, proj).

run_name: "2026-protoclr-lora-attn"

encoder:
  type: "protoclr"
  model_name: "ilyassmoummad/ProtoCLR"
  checkpoint: "protoclr.pth"
  embed_dim: 384

lora:
  rank: 8
  alpha: 16
  dropout: 0.1
  target_modules: ["attn.proj_q", "attn.proj_k", "attn.proj_v", "attn.proj"]

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 16000
  chunk_duration: 5.0
  batch_size: 256
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.1
  train_all: false           # set true (or use --train-all) to train on 100% focal data
  seed: 42

training:
  max_epochs: 50
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_epochs: 5
  threshold: 0.5
  hidden_dim: 0
  dropout: 0.0
  grad_clip_val: 1.0
  precision: "16-mixed"
  accumulate_grad_batches: 1

callbacks:
  model_checkpoint:
    monitor: "val/cmap"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/cmap"
    mode: "max"
    patience: 10
    min_delta: 0.001

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-lora-finetune"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
