# Exp 038 Stage 2 — fine-tune the Cell A (mixup-regularized, dual-BCE+LS) XC-pretrained
# EffNetV2-S backbone on the 234 BirdCLEF-2026 targets. PRIMARY arm.
#
# This is exp 032's 0.906 KD-SED recipe (configs/distilled_sed_kd.yaml) with exactly two changes:
#   1. encoder.model_name: tf_efficientnet_b0.ns_jft_in1k -> tf_efficientnetv2_s.in21k
#      (+ pretrained: false — the encoder is overwritten by our Stage-1 weights below, so we skip
#       the ImageNet-21k download; arch is identical to the pretrain run so the warm-start full-copies
#       every encoder param).
#   2. init.{from_checkpoint, encoder_only} — warm-start the EffNetV2-S backbone from the Stage-1
#      Cell A val/auroc-peak checkpoint (epoch23); re-init the 234-class head (encoder_only).
#
# batch_size 32 x accumulate 2 = effective 64 (the 0.906 recipe's effective batch), sized to fit a
# 24 GB rtx6000 alongside the GPU Perch-v2 KD teacher (CUDAExecutionProvider).
#
# Everything else (AttHeadLogitSpace, Tucker mel n_mels=256, dual-supervision 0.5/0.5 BCE, waveform
# mixup Beta(0.4,0.4) hard, focal x labeled-SS mixup, SpecAugment 1f+2t, AdamW 5e-4 -> 2ep warmup ->
# cosine 1e-6, 25 ep, 5-fold, Perch-v2 embedding KD alpha=1.0) is byte-for-byte the 0.906 recipe.

run_name: "2026-exp038-finetune-cellA"

encoder:
  type: "efficientnet"
  model_name: "tf_efficientnetv2_s.in21k"
  pretrained: false           # warm-started from our Stage-1 ckpt (see init.from_checkpoint)
  use_post_head: true         # 1280-d post-head features (matches Stage-1 + the 0.906 recipe)
  drop_path_rate: 0.1
  in_chans: 1

# Warm-start: full-copy the EffNetV2-S backbone from Stage-1 Cell A (epoch23 = val/auroc peak);
# re-init the 234-class head (encoder_only drops the 2,683-class pretrain head).
init:
  from_checkpoint: "/storage/project/ps-clef2026_birdclef-0/mgustineli3/experiments/038-xc-pretraining/checkpoints/2026-exp038-pretrain-cellA-dualbce/epoch23.ckpt"
  encoder_only: true

sed_head:
  type: "att_head_logit_space"
  hidden_dim: 512
  dropout: 0.5
  gem_p: 3.0

mel:
  type: "tucker"
  n_fft: 2048
  hop_length: 512
  n_mels: 256
  fmin: 20
  fmax: 16000
  top_db: 80.0
  power: 2.0
  gpu: true

spec_augment:
  enabled: true
  freq_mask_param: 10
  time_mask_param: 10
  num_freq_masks: 1
  num_time_masks: 2

mixup:
  focal_focal_prob: 0.5
  alpha: 0.4
  hard: true
  focal_sc_prob: 0.5
  focal_sc_alpha: 0.4
  aug_prob: 0.5

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 5.0
  batch_size: 32            # x accumulate 2 = effective 64 (fits rtx6000 + GPU KD teacher)
  num_workers: 8

  # DistilledSEDDataModule controls:
  n_folds: 5
  seed: 42
  min_sample: 20
  focal_share: 0.9
  sc_share: 0.1
  steps_per_epoch: null
  base_seed: 42
  seed_epoch_shift: true

  # Legacy SEDDataModule keys (unused by DistilledSEDDataModule):
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 0
  soundscape_test_files: 0

training:
  max_epochs: 25
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 2
  warmup_start_factor: 0.04
  eta_min: 1.0e-6
  threshold: 0.5
  grad_clip_val: 1.0
  precision: "16-mixed"
  accumulate_grad_batches: 2   # x batch_size 32 = effective 64
  per_sample_mel_norm: true

  # Dual-supervision loss weights (Tucker: 50/50)
  clipwise_weight: 0.5
  framewise_weight: 0.5

  # Inference blend (Tucker: 50/50 in probability space)
  blend_clip: 0.5
  blend_frame: 0.5

  # --- Perch v2 KD branch — ENABLED (match the 0.906 recipe) ---
  use_perch_distill: true
  perch_onnx_path: "vendor/kaggle/datasets/perch-v2-no-dft-onnx/perch_v2_no_dft.onnx"
  perch_embed_dim: 1536
  alpha_distill: 1.0

callbacks:
  model_checkpoint:
    monitor: "val/cmap"
    mode: "max"
    save_top_k: -1
    save_last: true
    filename: "best-epoch{epoch:02d}"
    every_n_epochs: 1
  early_stopping:
    monitor: "val/cmap"
    mode: "max"
    patience: 999
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp038"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
