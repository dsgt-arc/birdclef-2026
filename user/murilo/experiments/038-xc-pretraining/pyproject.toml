[project]
name = "exp038-xc-pretraining"
version = "0.1.0"
description = "Exp 038: Broad Neotropical XC supervised pretraining (EffNetV2-S IN21k, SED-mirror) -> Stage 2 fine-tune on the 234 BirdCLEF 2026 targets"
authors = [
    {name = "Murilo Gustineli", email = "mgustineli3@gatech.edu"}
]
requires-python = ">=3.11"
dependencies = [
    # Same ML stack as exp 032/037 (reuses DistilledSEDFinetuneModule + Tucker mel + SED head).
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",   # FocalLossBCE (Cell B focalbce arm) imports torchvision.ops
    "pytorch-lightning==2.6.1",
    "torchmetrics==1.9.0",
    "timm==1.0.26",
    "huggingface-hub==1.9.2",
    "wandb>=0.16.0",

    # Data handling
    "pyarrow>=15.0.0",
    "pandas>=2.0.0",

    # Audio processing
    "librosa>=0.10.0",
    "resampy>=0.4.0",
    "soundfile>=0.12.0",
    "nnAudio==0.3.4",

    # Perch v2 ONNX teacher is imported by sed_finetune (KD utilities) at module load — keep it
    # available even though pretraining runs with KD OFF (use_perch_distill=False).
    "onnxruntime-gpu==1.26.0",

    # Logging
    "tensorboard>=2.14.0",

    # GPU monitoring
    "nvidia-ml-py>=12.0.0",
    "matplotlib>=3.7.0",

    # Utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",

    # Scikit-learn (metrics)
    "scikit-learn>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef"]
