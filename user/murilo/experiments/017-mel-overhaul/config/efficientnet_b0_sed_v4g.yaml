# Experiment 017, Step 3: AttBlockV2 + BCE (v4g — Tom's recipe)
#
# Tests AttBlockV2 with its native loss pairing (BCE instead of soft CE).
# v4c tested AttBlockV2 with soft_ce and underperformed (0.815 val) due to the
# sigmoid → logit → softmax conversion mismatch. BCE operates on logits natively
# with sigmoid — the design AttBlockV2 was built for.
#
# Uses v4b base (AmplitudeToDB norm) since that's Tom's standard normalization
# across all 28 experiments.
#
# Changes from v4b:
#   - sed_head.type: att_head → att_block_v2
#   - training.loss_type: soft_ce → bce
#
# References:
#   - Tom's 28 experiments all use AttBlockV2 + BCE as baseline
#   - PANNs (Kong et al. 2020) designed AttBlockV2 for BCE
#   - 2025 1st place uses similar tanh+softmax attention

run_name: "2026-effnet-b0-sed-v4g"

encoder:
  type: "efficientnet"
  model_name: "efficientnet_b0"
  pretrained: true
  embed_dim: 320

sed_head:
  type: "att_block_v2"
  hidden_dim: 512
  dropout: 0.5
  gem_p: 3.0

mel:
  n_fft: 4096
  n_mels: 224
  hop_length: 320
  fmax: null
  gpu: true
  norm_type: "amplitude_to_db"
  top_db: 80.0

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 10.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 8
  soundscape_test_files: 0
  seed: 42

training:
  max_epochs: 50
  lr: 1.0e-4
  head_lr: 1.0e-3
  weight_decay: 0.01
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 1.0
  precision: "16-mixed"
  accumulate_grad_batches: 4
  clipwise_weight: 0.5
  framewise_weight: 0.5
  blend_clip: 0.75
  blend_frame: 0.25
  mixup_prob: 0.5
  mixup_alpha: 0.5
  loss_type: "bce"

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 10
    min_delta: 0.001

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-mel-overhaul"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
