# Experiment 017, Step 1: Mel overhaul (v4a)
#
# Changes from v1 (exp 016):
#   - mel.n_fft: 1024 → 4096  (4× frequency resolution: ~7.8 Hz/bin vs ~31 Hz/bin)
#   - mel.n_mels: 128 → 224   (1.75× spectral detail)
#   - mel.gpu: true            (mel on GPU to avoid CPU DataLoader bottleneck)
#   - batch_size: 128 → 64    (GPU mel STFT intermediates need memory)
#   - accumulate_grad_batches: 2 → 4  (same 256 effective batch)
#
# Everything else is identical to v1 to isolate the mel resolution variable.

run_name: "2026-effnet-b0-sed-v4a"

encoder:
  type: "efficientnet"
  model_name: "efficientnet_b0"
  pretrained: true
  embed_dim: 320

sed_head:
  hidden_dim: 512
  dropout: 0.5
  gem_p: 3.0

mel:
  n_fft: 4096
  n_mels: 224
  hop_length: 320
  fmax: null
  gpu: true  # Compute mel on GPU (n_fft=4096 is too slow on CPU DataLoader workers)

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 10.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.1
  soundscape_val_files: 8
  soundscape_test_files: 8
  seed: 42

training:
  max_epochs: 40
  lr: 1.0e-4
  head_lr: 1.0e-3
  weight_decay: 0.01
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 1.0
  precision: "16-mixed"
  accumulate_grad_batches: 4
  clipwise_weight: 0.5
  framewise_weight: 0.5
  blend_clip: 0.75
  blend_frame: 0.25
  mixup_prob: 0.5
  mixup_alpha: 0.5

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 10
    min_delta: 0.001

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-mel-overhaul"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
