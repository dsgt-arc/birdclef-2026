# Experiment 017, Step 3: StochasticDepth (v4e)
#
# Changes from v4a:
#   - encoder.drop_path_rate: 0.0 → 0.15 (stochastic depth regularization)
#   - data.test_fraction: 0.1 → 0.0 (90/10 split, validate on LB)
#   - training.max_epochs: 40 → 50
#
# 2025 1st place used drop_path_rate=0.15, some configs had 0.2.
# Randomly drops entire residual blocks during training to reduce overfitting.
# Especially useful with relatively small labeled dataset (~5K focal recordings).

run_name: "2026-effnet-b0-sed-v4e"

encoder:
  type: "efficientnet"
  model_name: "efficientnet_b0"
  pretrained: true
  embed_dim: 320
  drop_path_rate: 0.15

sed_head:
  hidden_dim: 512
  dropout: 0.5
  gem_p: 3.0

mel:
  n_fft: 4096
  n_mels: 224
  hop_length: 320
  fmax: null
  gpu: true

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 10.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 8
  soundscape_test_files: 0
  seed: 42

training:
  max_epochs: 50
  lr: 1.0e-4
  head_lr: 1.0e-3
  weight_decay: 0.01
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 1.0
  precision: "16-mixed"
  accumulate_grad_batches: 4
  clipwise_weight: 0.5
  framewise_weight: 0.5
  blend_clip: 0.75
  blend_frame: 0.25
  mixup_prob: 0.5
  mixup_alpha: 0.5

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 10
    min_delta: 0.001

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-mel-overhaul"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
