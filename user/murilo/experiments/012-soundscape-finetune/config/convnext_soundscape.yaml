# Experiment 012: ConvNeXt-Base LoRA — Soundscape Fine-Tuning
#
# Continues from exp 011 ConvNeXt checkpoint (best epoch 9, 80/10/10 split).
# Expands head from 206 → 234 classes, fine-tunes on mixed focal + soundscape data.

run_name: "2026-convnext-soundscape"

encoder:
  type: "convnext"
  model_name: "convnext_base.fb_in22k_ft_in1k"
  embed_dim: 1024
  pretrained: true

lora:
  rank: 8
  alpha: 16
  dropout: 0.1
  target_modules: ["fc1", "fc2"]

checkpoint:
  resume_from: "/storage/project/ps-clef2026_birdclef-0/mgustineli3/experiments/011-lora-baseline-2026/checkpoints/2026-convnext-lora-mlp-mlphead/best-epochepoch=09.ckpt"

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  chunk_duration: 5.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.1
  soundscape_val_files: 8
  soundscape_test_files: 8
  seed: 42

training:
  max_epochs: 20            # ConvNeXt converges fast (best epoch 9 in exp 011)
  lr: 1.0e-4               # lower LR for continued fine-tuning
  weight_decay: 0.01
  warmup_epochs: 2          # shorter warmup
  threshold: 0.5
  hidden_dim: 512           # MLP head (same as exp 011)
  dropout: 0.1
  grad_clip_val: 1.0
  precision: "16-mixed"
  accumulate_grad_batches: 4   # effective batch_size = 64 * 4 = 256

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 8
    min_delta: 0.001

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-soundscape-finetune"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
