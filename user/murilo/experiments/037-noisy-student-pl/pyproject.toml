[project]
name = "exp037-noisy-student-pl"
version = "0.1.0"
description = "Exp 037: Multi-iterative Noisy-Student soft pseudo-labels from the 0.929 ensemble teacher on the distilled-sed-kd recipe"
authors = [
    {name = "Murilo Gustineli", email = "mgustineli3@gatech.edu"}
]
requires-python = ">=3.11"
dependencies = [
    # Inherit the exp 032 dep pins exactly — same Tucker recipe + KD branch.
    # Source of truth: this file. No uv.lock — pins are tight enough on the
    # load-bearing ML stack; transitive non-ML drift is tolerated.
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "pytorch-lightning==2.6.1",
    "torchmetrics==1.9.0",
    "timm==1.0.26",
    "huggingface-hub==1.9.2",
    "wandb>=0.16.0",

    # Data handling
    "pyarrow>=15.0.0",
    "pandas>=2.0.0",

    # Audio processing
    "librosa>=0.10.0",
    "resampy>=0.4.0",
    "soundfile>=0.12.0",
    "nnAudio==0.3.4",

    # Perch v2 ONNX teacher (KD branch in distilled-sed-kd recipe)
    "onnxruntime-gpu==1.26.0",

    # Logging
    "tensorboard>=2.14.0",

    # GPU monitoring
    "nvidia-ml-py>=12.0.0",
    "matplotlib>=3.7.0",

    # Utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",

    # Scikit-learn (PL parquet processing + GroupKFold reuse)
    "scikit-learn>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef"]
