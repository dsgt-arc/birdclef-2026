# Experiment 029, Stage 1: pretrain v5j on BirdCLEF 2025 focal data.
#
# Identical to v5j (exp 019) and v5j_control (exp 027) EXCEPT:
#   - data_dir → 2025 path (taxonomy auto-resolves to 206 species)
#   - run_name + W&B project → exp029 pretrain identifiers
#   - dual_validation disabled (no labeled soundscapes used in 2025 stage)
#   - soundscape_val_files = 0 (don't try to load 2026 soundscapes)
#
# Output: best-by-val/auroc checkpoint to be loaded at Stage 2 fine-tune.

run_name: "2026-exp029-v5j-pretrain-2025"

encoder:
  type: "efficientnet"
  model_name: "hgnetv2_b0.ssld_stage2_ft_in1k"
  pretrained: true
  embed_dim: 1024

sed_head:
  type: "lse_head"
  hidden_dim: 1024
  dropout: 0.5
  gem_p: 3.0
  lse_temperature: 1.0
  freq_pool: "mean"

mel:
  n_fft: 2048
  hop_length: 313
  n_mels: 256
  fmax: null
  top_db: 80.0
  norm_type: "amplitude_to_db"
  gpu: true

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2025"
  sample_rate: 32000
  window_duration: 5.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 0  # 2025 doesn't ship labeled soundscapes in our pipeline; skip
  soundscape_test_files: 0
  seed: 42
  dual_validation: false  # focal-only validation for the pretrain stage

training:
  max_epochs: 20
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 0
  precision: "16-mixed"
  accumulate_grad_batches: 1
  clipwise_weight: 1.0
  framewise_weight: 0.0
  blend_clip: 1.0
  blend_frame: 0.0
  loss_type: "bce"
  mixup_prob: 1.0
  mixup_alpha: 1.0
  mixup_warmup_epochs: 5
  mixup_theta: 0.8
  mixup_per_sample: true
  scheduler_type: "one_cycle"
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 4.0

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 999  # effectively disabled; rely on best-checkpoint selection
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp029"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
