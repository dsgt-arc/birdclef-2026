# Experiment 029, Stage 2: fine-tune from 2025-pretrained checkpoint on BirdCLEF 2026.
#
# Identical to v5j (exp 019) and v5j_control (exp 027) EXCEPT:
#   - lr / head_lr reduced from 5e-4 to 2e-4 (warm start from pretrained init)
#   - new `init` block: load Stage 1 checkpoint, transfer 41 overlap species
#     classifier rows, randomly init the rest
#
# Output: best-by-val/auroc checkpoint for ONNX export and LB submission.

run_name: "2026-exp029-v5j-finetune-2026"

encoder:
  type: "efficientnet"
  model_name: "hgnetv2_b0.ssld_stage2_ft_in1k"
  pretrained: true  # ImageNet init for the few params not in the 2025 ckpt; will be overwritten by transfer for the rest
  embed_dim: 1024

sed_head:
  type: "lse_head"
  hidden_dim: 1024
  dropout: 0.5
  gem_p: 3.0
  lse_temperature: 1.0
  freq_pool: "mean"

mel:
  n_fft: 2048
  hop_length: 313
  n_mels: 256
  fmax: null
  top_db: 80.0
  norm_type: "amplitude_to_db"
  gpu: true

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 5.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 8
  soundscape_test_files: 0
  seed: 42
  dual_validation: true

training:
  max_epochs: 20
  lr: 2.0e-4         # CHANGED from v5j's 5e-4 — warm start from pretrained init
  head_lr: 2.0e-4    # CHANGED from v5j's 5e-4 — warm start
  weight_decay: 1.0e-4
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 0
  precision: "16-mixed"
  accumulate_grad_batches: 1
  clipwise_weight: 1.0
  framewise_weight: 0.0
  blend_clip: 1.0
  blend_frame: 0.0
  loss_type: "bce"
  mixup_prob: 1.0
  mixup_alpha: 1.0
  mixup_warmup_epochs: 5
  mixup_theta: 0.8
  mixup_per_sample: true
  scheduler_type: "one_cycle"
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 4.0

# Init block — loaded by train.py after model construction.
init:
  # Stage 1 best-by-val/auroc checkpoint (epoch 15, val/auroc 0.972, SLURM 7432887)
  from_checkpoint: "/storage/project/ps-clef2026_birdclef-0/mgustineli3/experiments/029-2025-pretrain/checkpoints/2026-exp029-v5j-pretrain-2025/best-epochepoch=15.ckpt"
  source_taxonomy_csv: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2025/taxonomy.csv"
  # transfer behaviour:
  #   - any ckpt param with shape matching the destination → copy directly
  #   - classifier param (first dim == source num_classes) → for each species
  #     in (source ∩ target) overlap, copy that row; rest keep random init
  #   - if `from_checkpoint` is empty, ImageNet init is used (i.e. v5j baseline)

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 999
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp029"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
