[project]
name = "exp032-tucker-distilled-sed"
version = "0.1.0"
description = "Exp 032: Full Tucker distilled-SED replication (EffNet-B0 NS-JFT + logit-space AttHead + dual-supervision + Perch v2 KD + 5-fold + PP)"
authors = [
    {name = "Murilo Gustineli", email = "mgustineli3@gatech.edu"}
]
requires-python = ">=3.11"
dependencies = [
    # Source of truth: this file. No uv.lock — direct pins below are tight
    # enough to fix the load-bearing ML deps; transitive non-ML drift is
    # tolerated. Pins match the exp 031 uv.lock resolved versions (v5j-era,
    # post-drift-investigation per commit 9f9ec3d) so cross-experiment
    # comparisons stay clean.
    #
    # torch is pinned to the cu121 wheel range; SLURM scripts override the
    # index with --index-url https://download.pytorch.org/whl/cu121 to get
    # the GPU build.
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "pytorch-lightning==2.6.1",
    "torchmetrics==1.9.0",
    "timm==1.0.26",
    "huggingface-hub==1.9.2",
    "wandb>=0.16.0",

    # Data handling
    "pyarrow>=15.0.0",
    "pandas>=2.0.0",

    # Audio processing
    "librosa>=0.10.0",
    "resampy>=0.4.0",
    "soundfile>=0.12.0",
    "nnAudio==0.3.4",

    # Perch v2 ONNX teacher — pin exact so teacher output is bit-stable
    # across exp 031 vs exp 032 runs.
    "onnxruntime-gpu==1.26.0",

    # Logging
    "tensorboard>=2.14.0",

    # GPU monitoring
    "nvidia-ml-py>=12.0.0",
    "matplotlib>=3.7.0",  # for gpu_monitor.save_plot() → outputs/gpu_check/*.png

    # Utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef"]
