# Experiment 032 — distilled_sed_kd: full Tucker distilled-SED recipe with
# Perch v2 KD branch ENABLED.
#
# Identical to distilled_sed_control.yaml except:
#   - run_name: 2026-exp032-distilled-sed-kd
#   - training.use_perch_distill: true
#   - training.perch_onnx_path: vendor/kaggle/datasets/perch-v2-no-dft-onnx/perch_v2_no_dft.onnx
#
# When KD is on:
#   - DistilledSEDFinetuneModule builds DistillHead (GAP+Linear → 1536-d) and
#     a PerchTeacher (frozen ONNX session).
#   - training_step computes Perch embedding on raw waveform (cropped/padded
#     to 160000 samples), then mel + per-sample norm + SpecAugment.
#   - Forward: encoder.forward_features → distill_emb (full backbone grad);
#     features.detach() → sed_head (cls branch: no backbone grad).
#   - Loss = (0.5·BCE(clip) + 0.5·BCE(frame_max)) + alpha_distill · MSE(distill_emb, perch_emb).
#
# Tucker quantifies the KD lift at ~+0.02 LB (audit § Tucker's loss). Our
# Phase 1 pairs this against distilled_sed_control (same job batch / same
# partition / same hardware window) so the Δ is isolated from cross-run variance.
#
# Reference: proposal.md § Falsifiable; tasks.md § 0.9.

run_name: "2026-exp032-distilled-sed-kd"

encoder:
  type: "efficientnet"
  model_name: "tf_efficientnet_b0.ns_jft_in1k"
  pretrained: true
  use_post_head: true
  drop_path_rate: 0.1
  in_chans: 1

sed_head:
  type: "att_head_logit_space"
  hidden_dim: 512
  dropout: 0.5
  gem_p: 3.0

mel:
  # Tucker-faithful mel: TuckerMelSpectrogram (torchaudio MelSpec +
  # AmplitudeToDB(80), no internal norm). See distilled_sed_control.yaml
  # for the full rationale (Phase D § D.2 diagnostic).
  type: "tucker"
  n_fft: 2048
  hop_length: 512
  n_mels: 256
  fmin: 20
  fmax: 16000
  top_db: 80.0
  power: 2.0
  gpu: true

spec_augment:
  enabled: true
  freq_mask_param: 10
  time_mask_param: 10
  num_freq_masks: 1
  num_time_masks: 2

mixup:
  focal_focal_prob: 0.5
  alpha: 0.4
  hard: true
  focal_sc_prob: 0.5
  focal_sc_alpha: 0.4
  aug_prob: 0.5

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 5.0
  batch_size: 64
  num_workers: 0

  # DistilledSEDDataModule controls:
  n_folds: 5
  seed: 42
  min_sample: 20
  focal_share: 0.9
  sc_share: 0.1
  steps_per_epoch: null
  base_seed: 42
  seed_epoch_shift: true

  # Legacy SEDDataModule keys (unused by DistilledSEDDataModule):
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 0
  soundscape_test_files: 0

training:
  max_epochs: 25
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 2
  warmup_start_factor: 0.04
  eta_min: 1.0e-6
  threshold: 0.5
  grad_clip_val: 1.0
  precision: "16-mixed"
  accumulate_grad_batches: 1
  per_sample_mel_norm: true

  # Dual-supervision loss weights (Tucker: 50/50)
  clipwise_weight: 0.5
  framewise_weight: 0.5

  # Inference blend (Tucker: 50/50 in probability space)
  blend_clip: 0.5
  blend_frame: 0.5

  # --- Perch v2 KD branch — ENABLED ---
  # ONNX teacher: re-uses the vendored Perch v2 file from exp 020. Path is
  # resolved relative to ACTUAL_REPO_ROOT by train.py.
  use_perch_distill: true
  perch_onnx_path: "vendor/kaggle/datasets/perch-v2-no-dft-onnx/perch_v2_no_dft.onnx"
  perch_embed_dim: 1536
  alpha_distill: 1.0           # Tucker's ALPHA_DISTILL

callbacks:
  model_checkpoint:
    monitor: "val/cmap"
    mode: "max"
    save_top_k: -1
    save_last: true
    filename: "best-epoch{epoch:02d}"
    every_n_epochs: 1
  early_stopping:
    monitor: "val/cmap"
    mode: "max"
    patience: 999
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp032"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
