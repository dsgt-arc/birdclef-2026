[project]
name = "mixit-pseudo-labeling"
version = "0.1.0"
description = "Exp 013: MixIT source separation + pseudo-labeling for BirdCLEF 2026"
authors = [
    {name = "Murilo Gustineli", email = "mgustineli3@gatech.edu"}
]
requires-python = ">=3.11"
dependencies = [
    # Core ML/DL
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "torchmetrics>=1.0.0",
    "timm>=0.9.0",
    "wandb>=0.16.0",
    "transformers>=4.30.0",
    "peft>=0.7.0",

    # ProtoCLR / CvT dependencies
    "einops",
    "torchinfo",
    "huggingface-hub",

    # Data handling
    "pandas>=2.0.0",

    # Audio processing
    "librosa>=0.10.0",
    "resampy>=0.4.0",
    "soundfile>=0.12.0",
    "nnAudio>=0.3",

    # ONNX inference (Phases 2-4)
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",

    # Utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "scipy>=1.10.0",

    # Logging
    "tensorboard>=2.14.0",

    # GPU monitoring
    "nvidia-ml-py>=12.0.0",

    # Visualization
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
mixit-convert = [
    # Only needed for Phase 1 (TF1 → ONNX conversion)
    "tensorflow>=2.10.0",
    "tf2onnx>=1.14.0",
]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef"]
