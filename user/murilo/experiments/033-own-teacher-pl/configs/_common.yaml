# ============================================================================
# Exp 033 — _common.yaml: documentation of the SHARED config that all 10
# ablations inherit. NOT a runnable config — train.py loads the per-ablation
# YAML directly. This file exists so the diff between a{1..5}_{v5j,kd}.yaml
# files is small and the SHARED knobs are auditable in one place.
#
# Inherits the Tucker recipe + Perch v2 KD branch from exp 032
# (distilled_sed_kd.yaml). Only the `pseudo_label:` section is NEW vs exp 032.
# ============================================================================

# Run name — override per ablation as 2026-exp033-a{N}-{v5j|kd}
run_name: "2026-exp033-_common"

encoder:
  type: "efficientnet"
  model_name: "tf_efficientnet_b0.ns_jft_in1k"
  pretrained: true
  use_post_head: true
  drop_path_rate: 0.1
  in_chans: 1

sed_head:
  type: "att_head_logit_space"
  hidden_dim: 512
  dropout: 0.5
  gem_p: 3.0

mel:
  type: "tucker"
  n_fft: 2048
  hop_length: 512
  n_mels: 256
  fmin: 20
  fmax: 16000
  top_db: 80.0
  power: 2.0
  gpu: true

spec_augment:
  enabled: true
  freq_mask_param: 10
  time_mask_param: 10
  num_freq_masks: 1
  num_time_masks: 2

mixup:
  focal_focal_prob: 0.5
  alpha: 0.4
  hard: true
  focal_sc_prob: 0.5
  focal_sc_alpha: 0.4
  aug_prob: 0.5

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 5.0
  batch_size: 64
  num_workers: 0
  n_folds: 5
  seed: 42
  min_sample: 20
  # focal_share / sc_share / pl_share are set in the pseudo_label section below
  steps_per_epoch: null
  base_seed: 42
  seed_epoch_shift: true
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 0
  soundscape_test_files: 0

training:
  # Override per ablation:
  #   - random-init runs (A1/A2/A5): max_epochs=25, lr=5e-4, warmup_epochs=2
  #   - warm-start runs (A3/A4): max_epochs=10, lr=5e-5, warmup_epochs=0, warm_start_ckpt=...
  max_epochs: 25
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 2
  warmup_start_factor: 0.04
  eta_min: 1.0e-6
  threshold: 0.5
  grad_clip_val: 1.0
  precision: "16-mixed"
  accumulate_grad_batches: 1
  per_sample_mel_norm: true

  clipwise_weight: 0.5
  framewise_weight: 0.5

  blend_clip: 0.5
  blend_frame: 0.5

  # Perch v2 KD — ENABLED (Tucker recipe)
  use_perch_distill: true
  perch_onnx_path: "vendor/kaggle/datasets/perch-v2-no-dft-onnx/perch_v2_no_dft.onnx"
  perch_embed_dim: 1536
  alpha_distill: 1.0

  # Warm-start ckpt — null for random-init ablations (A1/A2/A5); points at
  # Phase D last-v2.ckpt for warm-start ablations (A3/A4).
  warm_start_ckpt: null

# ============================================================================
# NEW SECTION (exp 033) — pseudo-label config
# ============================================================================
pseudo_label:
  # Required: path to the PL parquet. v1 (v5j-4fold teacher) is ready; v2
  # (distilled-sed-kd-5fold teacher) generated by sbatch/generate_pseudo_labels.sh.
  path: null  # override per ablation: T1 or T2 path

  # Per-sample loss weight applied to PL'd samples in the BCE branch.
  # 1.0 = Antoine 1:1 protocol (treat PL as GT-equivalent).
  weight: 1.0

  # Sampler strategy: "mixsamp" (use 3-source MixSamp with focal/sc/pl shares)
  # or "uniform" (DataLoader(shuffle=True) over the ConcatDataset).
  sampler: "uniform"

  # MixSamp 3-source shares — only used when sampler == "mixsamp".
  # Note: with effective PL pool 127K vs focal 26K vs labeled-sc 0.6K, the
  # "natural proportions" baseline is ~focal:0.17 / sc:0.005 / pl:0.83.
  # Tucker's original 0.9/0.1 shares were tuned for 792 SS, NOT 127K.
  focal_share: 0.5
  sc_share: 0.0
  pl_share: 0.5

  # Filter PL parquet to:
  #   - exclude val-fold SS files (prevent leak into student's val pool)
  #   - exclude labeled-SS train files (Antoine uses GT for labeled, PL only for unlabeled)
  exclude_labeled_sc: true

callbacks:
  model_checkpoint:
    monitor: "val/cmap"
    mode: "max"
    save_top_k: -1
    save_last: true
    filename: "best-epoch{epoch:02d}"
    every_n_epochs: 1
  early_stopping:
    monitor: "val/cmap"
    mode: "max"
    patience: 999
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp033"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
