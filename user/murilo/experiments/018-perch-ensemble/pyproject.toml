[project]
name = "birdclef-018-perch-ensemble"
version = "0.1.0"
description = "Perch v2 + EfficientNet-B0 SED ensemble for BirdCLEF 2026"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.3",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ipython",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
packages = []
