# Experiment 005: EAT Full Fine-tune (staged unfreezing)
#
# EAT-base encoder fine-tuned end-to-end on BirdCLEF 2025.
# Head trains alone for first 5 epochs, then encoder unfreezes with 10x lower LR.
# MLP head with hidden layer for better capacity.

run_name: "eat-finetune"

encoder:
  type: "eat"
  model_name: "worstchan/EAT-base_epoch30_pretrain"
  embed_dim: 768
  target_length: 512  # 5s at 16kHz with 10ms hop

data:
  data_dir: "~/ps-clef2026_birdclef-0/data/birdclef-2025"
  sample_rate: 16000
  chunk_duration: 5.0
  batch_size: 16               # smaller batch for full fine-tuning (more VRAM)
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.1
  seed: 42

training:
  max_epochs: 50
  lr: 1.0e-4                   # head learning rate
  encoder_lr: 1.0e-5           # encoder learning rate (10x lower)
  weight_decay: 0.01
  warmup_epochs: 5
  threshold: 0.5
  freeze_encoder: true         # start frozen
  unfreeze_epoch: 5            # unfreeze encoder at epoch 5
  hidden_dim: 512              # MLP head with hidden layer
  dropout: 0.1
  grad_clip_val: 1.0
  precision: "16-mixed"
  accumulate_grad_batches: 2   # effective batch size = 32

callbacks:
  model_checkpoint:
    monitor: "val/cmap"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/cmap"
    mode: "max"
    patience: 10
    min_delta: 0.001

logging:
  entity: "dsgt-arc"
  project: "birdclef-pretrained-finetune"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
