# Experiment 030 Phase B, effnetv2b0-control: EfficientNetV2-B0 backbone with
# v5j's training recipe and Zhang-style interpolated mixup.
#
# Tests whether Salman's backbone choice (EfficientNetV2-B0, his LB 0.937
# single-model) is the lever, with everything else identical to v5j-control.
# Pairs with effnetv2b0_sydorskyi.yaml to form the second leg of a 2x2 ablation:
#
#                       | spec mixup (v5j)    | wave mixup (sydorskyi)
#   HGNetV2-B0          | v5j_control          v5j_sydorskyi
#   EfficientNetV2-B0   | effnetv2b0_control   effnetv2b0_sydorskyi
#
# 2x2 lets us cleanly attribute:
#   - main effect of backbone:  effnetv2b0_control - v5j_control
#   - main effect of mixup:     v5j_sydorskyi - v5j_control
#   - interaction:              compare diagonals
#
# Backbone reference:
#   timm tag: tf_efficientnetv2_b0.in1k (ImageNet-1k pretrained, 7.1M params,
#   1280 feature channels — vs HGNetV2-B0's 1024).
#   Salman uses v2-B0 specifically; he says it's "faster to train compared
#   to others" and he gets 0.937 LB with it.

run_name: "2026-exp030-effnetv2b0-control"

encoder:
  type: "efficientnet"
  model_name: "tf_efficientnetv2_b0.in1k"     # CHANGED from v5j_control
  pretrained: true
  embed_dim: 1280                              # CHANGED from v5j (1024) — v2B0 has 1280 feature channels

sed_head:
  type: "lse_head"
  hidden_dim: 1024
  dropout: 0.5
  gem_p: 3.0
  lse_temperature: 1.0
  freq_pool: "mean"

mel:
  n_fft: 2048
  hop_length: 313
  n_mels: 256
  fmax: null
  top_db: 80.0
  norm_type: "amplitude_to_db"
  gpu: true

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 5.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 8
  soundscape_test_files: 0
  seed: 42
  dual_validation: true

training:
  max_epochs: 20
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 0
  precision: "16-mixed"
  accumulate_grad_batches: 1
  clipwise_weight: 1.0
  framewise_weight: 0.0
  blend_clip: 1.0
  blend_frame: 0.0
  loss_type: "bce"
  # v5j original mixup (interpolated, spec-domain) — pairs with v5j_control
  mixup_prob: 1.0
  mixup_alpha: 1.0
  mixup_warmup_epochs: 5
  mixup_theta: 0.8
  mixup_per_sample: true
  mixup_mode: "interpolate"
  raw_waveform_mixup: false
  scheduler_type: "one_cycle"
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 4.0

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 999
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp030"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
