# Experiment 030 Phase B, effnetv2b0-sydorskyi: EfficientNetV2-B0 backbone +
# Sydorskyi-faithful mixup. Fourth cell of the 2x2 ablation.
#
# The interesting comparison: effnetv2b0_sydorskyi vs effnetv2b0_control tests
# whether the mixup lever generalizes to a different backbone, AND
# effnetv2b0_sydorskyi vs v5j_sydorskyi tests whether the backbone change
# stacks with the mixup change.
#
# Single-variable changes from effnetv2b0_control: only the mixup config block.

run_name: "2026-exp030-effnetv2b0-sydorskyi-v2"

encoder:
  type: "efficientnet"
  model_name: "tf_efficientnetv2_b0.in1k"
  pretrained: true
  embed_dim: 1280

sed_head:
  type: "lse_head"
  hidden_dim: 1024
  dropout: 0.5
  gem_p: 3.0
  lse_temperature: 1.0
  freq_pool: "mean"

mel:
  n_fft: 2048
  hop_length: 313
  n_mels: 256
  fmax: null
  top_db: 80.0
  norm_type: "amplitude_to_db"
  gpu: true

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 5.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 8
  soundscape_test_files: 0
  seed: 42
  # v2 (2026-04-26): removed dual_validation. See v5j_control.yaml for the
  # rationale (-0.009 LB cost from focal-only val checkpoint selection).

training:
  max_epochs: 20
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 0
  precision: "16-mixed"
  accumulate_grad_batches: 1
  clipwise_weight: 1.0
  framewise_weight: 0.0
  blend_clip: 1.0
  blend_frame: 0.0
  loss_type: "bce"
  # Sydorskyi 2025 2nd place mixup recipe (matches v5j_sydorskyi.yaml)
  raw_waveform_mixup: true
  mixup_mode: "average_max"
  mixup_prob: 0.5
  mixup_warmup_epochs: 0
  mixup_theta: 1.0
  mixup_alpha: 1.0
  mixup_per_sample: true
  scheduler_type: "one_cycle"
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 4.0

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 999
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp030"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
