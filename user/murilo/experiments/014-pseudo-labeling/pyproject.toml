[project]
name = "pseudo-labeling"
version = "0.1.0"
description = "Teacher ensemble pseudo-labeling for BirdCLEF 2026 soundscapes"
requires-python = ">=3.11"
dependencies = [
    "onnxruntime-gpu",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
