# Mode B: MixIT-enhanced pseudo-labeling
# Each teacher runs on original + 4 separated channels, max-pool per model.
# Follows Bird MixIT paper Section 7.1.

mode: "mixit"
temperature: 1.0

mixit:
  separated_dir: "/storage/project/ps-clef2026_birdclef-0/shared/mixit/pretrained/soundscapes"
  n_channels: 4
  sr: 22050  # MixIT output sample rate

teachers:
  protoclr:
    slug: "protoclr-2026-soundscape"
    weights:
      Aves: 0.4
      Amphibia: 0.4
      Insecta: 0.5
      Mammalia: 0.4
      Reptilia: 0.4
  convnext:
    slug: "convnext-2026-soundscape"
    weights:
      Aves: 0.4
      Amphibia: 0.4
      Insecta: 0.5
      Mammalia: 0.4
      Reptilia: 0.4
  eat:
    slug: "eat-2026-soundscape"
    weights:
      Aves: 0.2
      Amphibia: 0.2
      Insecta: 0.0
      Mammalia: 0.2
      Reptilia: 0.2

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  weights_dir: "/storage/project/ps-clef2026_birdclef-0/mgustineli3/birdclef-2026/user/murilo/experiments/010-submission-pipeline/artifacts/weights"

output:
  base_dir: "/storage/project/ps-clef2026_birdclef-0/shared/pseudo-labels/birdclef-2026"
  run_name: "mode-b-v1"
