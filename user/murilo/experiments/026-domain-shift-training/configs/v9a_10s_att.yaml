# Experiment 026, Phase 3a: 10s window + AttHead
#
# v5j recipe with two changes:
#   1. window_duration: 5.0 → 10.0 (backbone sees 2× more context)
#   2. sed_head: lse_head → att_head (attention selects relevant frames)
#
# Also uses dual supervision (50% clipwise + 50% framewise) and framewise-max
# inference, matching the competition-standard AttHead setup (v6k from exp 021).
#
# Hypothesis: AttHead at 10s can learn to focus on the ~3-5s where the bird
# calls and ignore the rest. LSEHead at 10s (v5i: 0.880) failed because it
# pooled uniformly over all frames, diluting the call signal.
#
# batch_size reduced from 64 to 48 (2× wider spectrograms use more GPU memory).

run_name: "2026-exp026-v9a-10s-att"

encoder:
  type: "efficientnet"
  model_name: "hgnetv2_b0.ssld_stage2_ft_in1k"
  pretrained: true
  embed_dim: 1024

sed_head:
  type: "att_head"
  hidden_dim: 1024
  dropout: 0.5
  gem_p: 3.0

mel:
  n_fft: 2048
  hop_length: 313
  n_mels: 256
  fmax: null
  top_db: 80.0
  norm_type: "amplitude_to_db"
  gpu: true

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 10.0
  batch_size: 48
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 8
  soundscape_test_files: 0
  seed: 42
  dual_validation: true

training:
  max_epochs: 20
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 0
  precision: "16-mixed"
  accumulate_grad_batches: 1
  clipwise_weight: 0.5
  framewise_weight: 0.5
  blend_clip: 0.0
  blend_frame: 1.0
  loss_type: "bce"
  mixup_prob: 1.0
  mixup_alpha: 1.0
  mixup_warmup_epochs: 5
  mixup_theta: 0.8
  mixup_per_sample: true
  scheduler_type: "one_cycle"
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 4.0

callbacks:
  model_checkpoint:
    monitor: "val_sc/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val_sc/auroc"
    mode: "max"
    patience: 999
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp026"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
