# Experiment 021, v8a: HGNetV2-B0 + LSEHead + 3×5s multi-context
#
# Phase E: hengck23's approach — backbone sees 15s, LSEHead splits into 3 chunks.
# The backbone's receptive field provides cross-chunk context, but each LSE pool
# operates on 5s (T/3 frames) — same temporal resolution as v5j.
#
# Only TWO changes from v5j:
#   1. window_duration: 5.0 → 15.0 (3× longer input)
#   2. n_chunks: 1 → 3 (split temporal features before LSE pool)
# Everything else is identical: same head, loss, recipe, hyperparameters.
#
# Batch size halved (64 → 32) due to 3× wider spectrograms.
# Reference: hengck23 0.876 (5s) → 0.896 (3×5s) = +0.020 LB, 4-fold, no PP.

run_name: 2026-hgnet-b0-mc-lse-sed-v8a
encoder:
  type: efficientnet
  model_name: hgnetv2_b0.ssld_stage2_ft_in1k
  pretrained: true
  embed_dim: 1024
sed_head:
  type: lse_head
  hidden_dim: 1024
  dropout: 0.5
  gem_p: 3.0
  lse_temperature: 1.0
  freq_pool: mean
  n_chunks: 3
mel:
  n_fft: 2048
  hop_length: 313
  n_mels: 256
  fmax: null
  top_db: 80.0
  norm_type: amplitude_to_db
  gpu: true
data:
  data_dir: /storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026
  sample_rate: 32000
  window_duration: 15.0
  batch_size: 32
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 8
  soundscape_test_files: 0
  seed: 42
training:
  max_epochs: 20
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 0
  precision: 16-mixed
  accumulate_grad_batches: 1
  clipwise_weight: 1.0
  framewise_weight: 0.0
  blend_clip: 1.0
  blend_frame: 0.0
  loss_type: bce
  mixup_prob: 1.0
  mixup_alpha: 1.0
  mixup_warmup_epochs: 5
  mixup_theta: 0.8
  mixup_per_sample: true
  scheduler_type: one_cycle
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 4.0
callbacks:
  model_checkpoint:
    monitor: val/auroc
    mode: max
    save_top_k: 1
    save_last: true
    filename: best-epoch{epoch:02d}
  early_stopping:
    monitor: val/auroc
    mode: max
    patience: 999
    min_delta: 0.0
logging:
  entity: dsgt-arc
  project: birdclef-2026-exp021
  save_dir: outputs/wandb
  log_model: false
  log_every_n_steps: 50
