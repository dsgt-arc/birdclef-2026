# Experiment 021, v6k: v5j recipe + competition-standard AttHead
#
# Single change from v5j: LSEHead → AttHead (Nikita/Tattaka competition standard).
# Three fixes vs our old AttHead (v6e-v6j):
#   1. Pre-dropout (p/2) before Linear
#   2. Attention: softmax(tanh(x)) instead of softmax(x)
#   3. Clipwise: sum(att × sigmoid(logits)) in probability space
#
# Training: dual supervision (50% clipwise + 50% framewise max).
# Inference: framewise-max only (blend_clip=0, blend_frame=1), matching
# Nikita 1st place 2025 who disables attention at inference entirely.
#
# Everything else identical to v5j: same backbone, loss, optimizer, schedule,
# augmentation, data, epochs, hidden_dim=1024. Isolates the head architecture.

run_name: "2026-hgnet-b0-atthead-v6k"

encoder:
  type: "efficientnet"
  model_name: "hgnetv2_b0.ssld_stage2_ft_in1k"
  pretrained: true
  embed_dim: 1024

sed_head:
  type: "att_head"
  hidden_dim: 1024
  dropout: 0.5
  gem_p: 3.0

mel:
  n_fft: 2048
  hop_length: 313
  n_mels: 256
  fmax: null
  top_db: 80.0
  norm_type: "amplitude_to_db"
  gpu: true

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 5.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 8
  soundscape_test_files: 0
  seed: 42

training:
  max_epochs: 20
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 0
  precision: "16-mixed"
  accumulate_grad_batches: 1
  clipwise_weight: 0.5
  framewise_weight: 0.5
  blend_clip: 0.0
  blend_frame: 1.0
  loss_type: "bce"
  mixup_prob: 1.0
  mixup_alpha: 1.0
  mixup_warmup_epochs: 5
  mixup_theta: 0.8
  mixup_per_sample: true
  scheduler_type: "one_cycle"
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 4.0

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 999
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp021"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
