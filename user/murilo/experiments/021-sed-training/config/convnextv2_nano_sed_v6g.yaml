# Experiment 021, v6g: ConvNeXt-V2 Nano backbone
#
# Change from v5j: backbone hgnetv2_b0 → convnextv2_nano (15M params, 640 embed dim).
#
# Motivation: Salman says "MBConvs from EfficientNets are not learning that well,
# compared to other architectures." ConvNeXt-V2 uses a modern ConvNet design
# (no MBConv blocks, depthwise convolutions + LayerNorm). Pretrained on
# ImageNet-22K→1K (FCMAE self-supervised pretraining). 15M params is larger
# than HGNetV2-B0 (6M) but still fast enough for ONNX inference.

run_name: "2026-convnextv2-nano-sed-v6g"

encoder:
  type: "efficientnet"
  # CHANGED: ConvNeXt-V2 Nano (15M params, 640 embed dim)
  model_name: "convnextv2_nano.fcmae_ft_in22k_in1k"
  pretrained: true
  embed_dim: 640

sed_head:
  type: "lse_head"
  # CHANGED: match embed_dim
  hidden_dim: 640
  dropout: 0.5
  gem_p: 3.0
  lse_temperature: 1.0
  freq_pool: "mean"

mel:
  n_fft: 2048
  hop_length: 313
  n_mels: 256
  fmax: null
  top_db: 80.0
  norm_type: "amplitude_to_db"
  gpu: true

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 5.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 8
  soundscape_test_files: 0
  seed: 42

training:
  max_epochs: 20
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 0
  precision: "16-mixed"
  accumulate_grad_batches: 1
  clipwise_weight: 1.0
  framewise_weight: 0.0
  blend_clip: 1.0
  blend_frame: 0.0
  loss_type: "bce"
  mixup_prob: 1.0
  mixup_alpha: 1.0
  mixup_warmup_epochs: 5
  mixup_theta: 0.8
  mixup_per_sample: true
  scheduler_type: "one_cycle"
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 4.0

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 999
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp021"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
