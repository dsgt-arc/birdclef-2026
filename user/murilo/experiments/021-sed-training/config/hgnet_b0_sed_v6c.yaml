# Experiment 021, v6c: Waveform MixUp + Pink Noise + Time Stretch
#
# Changes from v5j: raw waveform mixup + additional waveform augmentations.
#
# Motivation: yukiZ reports "Pink Noise" and "Time Stretch" on raw waveforms
# are effective, commonly used in past BirdCLEF winning solutions.
#
# NOTE: waveform_noise and waveform_time_stretch need implementation in train.py.
# Config defines the flags; implementation added when training Phase B.

run_name: "2026-hgnet-b0-sed-v6c"

encoder:
  type: "efficientnet"
  model_name: "hgnetv2_b0.ssld_stage2_ft_in1k"
  pretrained: true
  embed_dim: 1024

sed_head:
  type: "lse_head"
  hidden_dim: 1024
  dropout: 0.5
  gem_p: 3.0
  lse_temperature: 1.0
  freq_pool: "mean"

mel:
  n_fft: 2048
  hop_length: 313
  n_mels: 256
  fmax: null
  top_db: 80.0
  norm_type: "amplitude_to_db"
  gpu: true

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 5.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 8
  soundscape_test_files: 0
  seed: 42

training:
  max_epochs: 20
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 0
  precision: "16-mixed"
  accumulate_grad_batches: 1
  clipwise_weight: 1.0
  framewise_weight: 0.0
  blend_clip: 1.0
  blend_frame: 0.0
  loss_type: "bce"
  mixup_prob: 1.0
  mixup_alpha: 1.0
  mixup_warmup_epochs: 5
  mixup_theta: 0.8
  mixup_per_sample: true
  # CHANGED: waveform-domain augmentations
  raw_waveform_mixup: true
  waveform_noise: true        # Pink noise injection (needs train.py impl)
  waveform_time_stretch: true  # Time stretch augmentation (needs train.py impl)
  scheduler_type: "one_cycle"
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 4.0

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 999
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp021"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
