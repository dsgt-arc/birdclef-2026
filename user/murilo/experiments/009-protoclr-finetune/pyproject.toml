[project]
name = "protoclr-finetune"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchaudio",
    "pytorch-lightning",
    "torchmetrics",
    "timm",
    "einops",
    "wandb",
    "peft>=0.7.0",
    "huggingface-hub",
    "datasets",
    "pandas",
    "librosa",
    "nnAudio",
    "tensorboard",
    "nvidia-ml-py",
    "pyyaml",
    "python-dotenv",
    "tqdm",
    "matplotlib",
    "seaborn",
    "kaggle",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef"]
