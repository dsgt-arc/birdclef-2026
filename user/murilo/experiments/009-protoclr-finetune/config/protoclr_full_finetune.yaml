run_name: "protoclr-full-finetune"

encoder:
  type: "protoclr"
  model_name: "ilyassmoummad/ProtoCLR"
  checkpoint: "protoclr.pth"
  embed_dim: 384

# No `lora:` section → all 19M parameters are trainable (full fine-tuning)

data:
  data_dir: "~/ps-clef2026_birdclef-0/data/birdclef-2025"
  sample_rate: 16000
  chunk_duration: 5.0
  batch_size: 256
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.1
  seed: 42

training:
  max_epochs: 50
  lr: 1.0e-4           # 3x lower than LoRA (3e-4) to avoid catastrophic forgetting
  weight_decay: 0.01
  warmup_epochs: 5
  threshold: 0.5
  hidden_dim: 0
  dropout: 0.0
  grad_clip_val: 1.0
  precision: "16-mixed"
  accumulate_grad_batches: 1

callbacks:
  model_checkpoint:
    monitor: "val/cmap"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/cmap"
    mode: "max"
    patience: 10
    min_delta: 0.001

logging:
  entity: "dsgt-arc"
  project: "birdclef-protoclr-finetune"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
