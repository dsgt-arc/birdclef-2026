# Experiment 008 — Config B: Control
#
# Random 16x16 patch embedding (trainable) + LoRA r=8 on attention layers.
# Isolates the effect of losing pretrained patch embeddings.
# 256 tokens (32x8 grid).

run_name: "config-b-control"

encoder:
  type: "eat"
  model_name: "worstchan/EAT-base_epoch30_pretrain"
  embed_dim: 768
  target_length: 512  # 5s at 16kHz with 10ms hop

patch_embed:
  type: "random_square"
  patch_size: [16, 16]   # (time, freq)
  freeze: false

model:
  partial_unfreeze_blocks: []

lora:
  rank: 8
  alpha: 16
  dropout: 0.1
  target_modules: ["qkv", "proj"]

data:
  data_dir: "~/ps-clef2026_birdclef-0/data/birdclef-2025"
  sample_rate: 16000
  chunk_duration: 5.0
  batch_size: 32
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.1
  seed: 42

training:
  max_epochs: 100
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_epochs: 5
  threshold: 0.5
  hidden_dim: 0                # linear head
  dropout: 0.0
  grad_clip_val: 1.0
  precision: "16-mixed"
  accumulate_grad_batches: 8   # effective batch_size = 32 * 8 = 256

callbacks:
  model_checkpoint:
    monitor: "val/cmap"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/cmap"
    mode: "max"
    patience: 15
    min_delta: 0.001

logging:
  entity: "dsgt-arc"
  project: "birdclef-frame-tokenization-eat"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
