# Experiment 008 — Config C3: Frame + Partial Unfreeze (Phase 2 placeholder)
#
# Random frame patch embedding (trainable) + LoRA r=8 on attention layers
# + blocks 0-1 fully unfrozen for full-rank training.
# Tests whether bridge layers between new patch embedding and deeper blocks help.
# Patch size TBD after Phase 1 analysis — update patch_size before running.

run_name: "config-c3-frame-partial-unfreeze"

encoder:
  type: "eat"
  model_name: "worstchan/EAT-base_epoch30_pretrain"
  embed_dim: 768
  target_length: 512  # 5s at 16kHz with 10ms hop

patch_embed:
  type: "frame"
  patch_size: [2, 128]   # (time, freq) — TBD: update after Phase 1
  freeze: false

model:
  partial_unfreeze_blocks: [0, 1]

lora:
  rank: 8
  alpha: 16
  dropout: 0.1
  target_modules: ["qkv", "proj"]

data:
  data_dir: "~/ps-clef2026_birdclef-0/data/birdclef-2025"
  sample_rate: 16000
  chunk_duration: 5.0
  batch_size: 32
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.1
  seed: 42

training:
  max_epochs: 100
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_epochs: 5
  threshold: 0.5
  hidden_dim: 0                # linear head
  dropout: 0.0
  grad_clip_val: 1.0
  precision: "16-mixed"
  accumulate_grad_batches: 8   # effective batch_size = 32 * 8 = 256

callbacks:
  model_checkpoint:
    monitor: "val/cmap"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/cmap"
    mode: "max"
    patience: 15
    min_delta: 0.001

logging:
  entity: "dsgt-arc"
  project: "birdclef-frame-tokenization-eat"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
