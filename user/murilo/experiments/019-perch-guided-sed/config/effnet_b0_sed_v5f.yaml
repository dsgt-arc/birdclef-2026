# Experiment 019, v5f: EfficientNet-B0 + ttahara's full training recipe
#
# Faithful reproduction of ttahara's training pipeline (0.884 LB) on our
# EfficientNet-B0 backbone. Isolates recipe impact vs architecture.
#
# Changes from v4b:
#   - Head: LSEHead with mean(freq) instead of AttHead with GeM(freq)
#   - Loss: BCEWithLogitsLoss (clipwise only, no dual framewise loss)
#   - MixUp: alpha=1.0, theta=0.8, per-sample lambda, 100% prob, 5-epoch warmup
#   - Mel: torchaudio (n_fft=2048, win_length=626, resize 256x256, min-max)
#   - Optimizer: uniform lr=5e-4, weight_decay=1e-4, OneCycleLR per-step
#   - 5s segments, 20 epochs, no grad accum, no grad clip
#
# Reference: user/murilo/notes/ttahara-hgnetv2-b0-annotated.md
# Source: kaggle kernels pull ttahara/birdclef-2026-hgnetv2-b0-baseline-training

run_name: "2026-effnet-b0-sed-v5f"

encoder:
  type: "efficientnet"
  model_name: "efficientnet_b0"
  pretrained: true
  embed_dim: 320

sed_head:
  type: "lse_head"
  hidden_dim: 320
  dropout: 0.5
  gem_p: 3.0
  lse_temperature: 1.0
  freq_pool: "mean"

mel:
  type: "ttahara"
  n_fft: 2048
  win_length: 626
  hop_length: 313
  f_min: 20
  n_mels: 256
  top_db: 80.0
  target_shape: [256, 256]
  gpu: true

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 5.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 8
  soundscape_test_files: 0
  seed: 42

training:
  max_epochs: 20
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 0
  precision: "16-mixed"
  accumulate_grad_batches: 1
  clipwise_weight: 1.0
  framewise_weight: 0.0
  blend_clip: 1.0
  blend_frame: 0.0
  loss_type: "bce"
  mixup_prob: 1.0
  mixup_alpha: 1.0
  mixup_warmup_epochs: 5
  mixup_theta: 0.8
  mixup_per_sample: true
  scheduler_type: "one_cycle"
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 4.0

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 999
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp019"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
