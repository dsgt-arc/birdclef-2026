# Experiment 015: ProtoCLR Student — Pseudo-Label Training
#
# Continues from exp 012 ProtoCLR checkpoint (best epoch 11, 234 classes).
# Fine-tunes on focal + labeled soundscape + pseudo-labeled soundscape data.

run_name: "2026-protoclr-student-v1"

encoder:
  type: "protoclr"
  model_name: "ilyassmoummad/ProtoCLR"
  checkpoint: "protoclr.pth"
  embed_dim: 384

lora:
  rank: 8
  alpha: 16
  dropout: 0.1
  target_modules: ["attn.proj_q", "attn.proj_k", "attn.proj_v", "attn.proj"]

checkpoint:
  resume_from: "/storage/project/ps-clef2026_birdclef-0/mgustineli3/experiments/012-soundscape-finetune/checkpoints/2026-protoclr-soundscape/best-epochepoch=11.ckpt"

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 16000
  chunk_duration: 5.0
  batch_size: 256
  num_workers: 12
  val_fraction: 0.1
  test_fraction: 0.1
  soundscape_val_files: 8
  soundscape_test_files: 8
  seed: 42

pseudo_labels:
  parquet_dir: "/storage/project/ps-clef2026_birdclef-0/shared/pseudo-labels/birdclef-2026/pcr-cnx-soundscape-v1/unlabeled/"
  weight: 0.5

training:
  max_epochs: 30
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_epochs: 3
  threshold: 0.5
  hidden_dim: 0
  dropout: 0.0
  grad_clip_val: 1.0
  precision: "16-mixed"
  accumulate_grad_batches: 1

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: 1
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 8
    min_delta: 0.001

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-student-training"
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
