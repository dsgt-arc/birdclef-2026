[project]
name = "submission-pipeline"
version = "0.1.0"
description = "Exp 010: BirdCLEF 2026 submission pipeline (ONNX export + Kaggle inference)"
authors = [
    {name = "Murilo Gustineli", email = "mgustineli3@gatech.edu"}
]
requires-python = ">=3.11"
dependencies = [
    # Core ML/DL
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "torchmetrics>=1.0.0",
    "timm>=0.9.0",
    "transformers>=4.30.0",
    "peft>=0.7.0",
    "einops>=0.6.0",
    "torchinfo>=1.8.0",
    "scipy>=1.10.0",
    "huggingface-hub>=0.20.0",

    # Audio processing
    "librosa>=0.10.0",
    "resampy>=0.4.0",
    "soundfile>=0.12.0",
    "nnAudio>=0.3",

    # ONNX export/inference
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",

    # Data handling
    "datasets==3.6.0",
    "pyarrow>=15.0.0",
    "polars>=0.19.0",
    "pandas>=2.0.0",

    # Utilities
    "pyyaml>=6.0",
    "tqdm>=4.65.0",

    # Kaggle CLI
    "kaggle>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This experiment has no Python package — it's scripts-only.
# Point to a minimal stub so hatchling doesn't error on editable install.
packages = ["src/submission_pipeline"]
