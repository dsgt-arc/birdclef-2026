[pytest]
# Tests organized by experiment number
# Run from user/murilo/ directory with: pytest tests/
testpaths = .
python_files = test_*.py
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    download: marks tests that require downloading data
addopts = -v --tb=short --color=yes

# Test organization:
# tests/
# ├── 001-birdset-bioacoustics-benchmark/  (Experiment 001 tests)
# ├── 002-next-experiment/                  (Future experiments)
# └── common/                               (Shared fixtures and utilities)
