# Diagnostic config for v5j-era codebase regression investigation (2026-05-10).
#
# Identical recipe to hgnet_b0_sed_v5j.yaml (v5j-original training config)
# EXCEPT for save_top_k: -1 (preserves all 20 epochs so we can submit ep 19).
#
# This config runs in a worktree at git commit e420633 (v5j-era code) but
# inside today's environment. It is the GROUND-TRUTH test for whether the
# codebase regression discovered in exp 031 (today's training of v5j_control
# lands at LB 0.897 vs v5j-original's 0.906) is in the codebase itself.
#
# Outcome interpretation:
# - Diagnostic ep 19 LB ≈ 0.906 → codebase IS the cause. Some path my static
#   diagnostics miss; bisect the 8 PRs to localize.
# - Diagnostic ep 19 LB ≈ 0.897 → codebase is NOT the cause. The drift is
#   environmental (data subtly changed, hardware-as-fleet variance, or
#   non-pinned dep we missed). Investigate further.
#
# Hash-compare the diagnostic ep 19 ckpt's state_dict against v5j-original's
# ep 19 ckpt BEFORE submitting to LB. If hashes match exactly, no LB
# submission is needed — the weights are bit-identical so LB will be 0.906.
# If hashes differ, submit to LB.

run_name: "2026-exp019-v5j-diag-eracode-may10"

encoder:
  type: "efficientnet"
  model_name: "hgnetv2_b0.ssld_stage2_ft_in1k"
  pretrained: true
  embed_dim: 1024

sed_head:
  type: "lse_head"
  hidden_dim: 1024
  dropout: 0.5
  gem_p: 3.0
  lse_temperature: 1.0
  freq_pool: "mean"

mel:
  n_fft: 2048
  hop_length: 313
  n_mels: 256
  fmax: null
  top_db: 80.0
  norm_type: "amplitude_to_db"
  gpu: true

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  window_duration: 5.0
  batch_size: 64
  num_workers: 8
  val_fraction: 0.1
  test_fraction: 0.0
  soundscape_val_files: 8
  soundscape_test_files: 0
  seed: 42

training:
  max_epochs: 20
  lr: 5.0e-4
  head_lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 0
  precision: "16-mixed"
  accumulate_grad_batches: 1
  clipwise_weight: 1.0
  framewise_weight: 0.0
  blend_clip: 1.0
  blend_frame: 0.0
  loss_type: "bce"
  mixup_prob: 1.0
  mixup_alpha: 1.0
  mixup_warmup_epochs: 5
  mixup_theta: 0.8
  mixup_per_sample: true
  scheduler_type: "one_cycle"
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 4.0

callbacks:
  model_checkpoint:
    monitor: "val/auroc"
    mode: "max"
    save_top_k: -1                 # ⭐ DIAGNOSTIC: preserve all 20 epochs
    save_last: true
    filename: "best-epoch{epoch:02d}"
  early_stopping:
    monitor: "val/auroc"
    mode: "max"
    patience: 999
    min_delta: 0.0

logging:
  entity: "dsgt-arc"
  project: "birdclef-2026-exp031"   # log here so we can compare against the other runs
  save_dir: "outputs/wandb"
  log_model: false
  log_every_n_steps: 50
