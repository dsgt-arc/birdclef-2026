[project]
name = "birdclef-scripts"
version = "0.1.0"
description = "Reusable scripts for BirdCLEF 2026"
requires-python = ">=3.11"
dependencies = [
    "onnxruntime>=1.16.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
