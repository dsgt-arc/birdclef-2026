[project]
name = "birdclef"
version = "0.1.0"
description = "BirdCLEF 2026 — bird species recognition from soundscapes"
authors = [
    {name = "Murilo Gustineli", email = "mgustineli3@gatech.edu"}
]
requires-python = ">=3.11"
dependencies = [
    # Core ML/DL
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchvision>=0.15.0",
    "pytorch-lightning>=2.0.0",
    "torchmetrics>=1.0.0",
    "transformers>=4.30.0",
    "numpy>=1.24.0",
    "timm>=0.9.0",
    "wandb>=0.16.0",
    "einops>=0.7.0",

    # Fine-tuning & model adaptation
    "peft>=0.7.0",           # LoRA and parameter-efficient fine-tuning
    "huggingface-hub",       # Model downloads

    # Data handling
    "datasets>=3.6.0",
    "pyarrow>=15.0.0",
    "polars>=0.19.0",
    "pandas>=2.0.0",

    # Audio processing
    "librosa>=0.10.0",
    "resampy>=0.4.0",
    "soundfile>=0.12.0",
    "audioread>=3.0.0",
    "nnAudio>=0.3",          # GPU-accelerated mel-spectrograms

    # Machine learning
    "scikit-learn>=1.3.0",

    # Kaggle
    "kaggle>=1.6.0",         # Competition data download

    # Utilities
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "nvidia-ml-py>=12.0.0",  # GPU monitoring

    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
    "pre-commit>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=birdclef --cov-report=term-missing"
