[project]
name = "birdset-benchmark"
version = "0.1.0"
description = "BirdSet bioacoustics model benchmarking"
authors = [
    {name = "Murilo Gustineli", email = "mgustineli3@gatech.edu"}
]
requires-python = ">=3.11"
dependencies = [
    # Core ML/DL
    "torch>=2.0.0",
    "numpy>=1.24.0",

    # Data handling
    "datasets>=2.14.0",  # HuggingFace datasets for BirdSet
    "polars>=0.19.0",    # Fast dataframes (preferred over pandas)
    "pandas>=2.0.0",     # Fallback if needed

    # Audio processing
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "audioread>=3.0.0",

    # Bioacoustics models
    "bioacoustics-model-zoo @ git+https://github.com/kitzeslab/bioacoustics-model-zoo.git@main",
    "opensoundscape>=0.10.0",

    # Machine learning
    "scikit-learn>=1.3.0",

    # Utilities
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",     # CLI framework
    "rich>=13.0.0",     # Beautiful terminal output

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=birdset_benchmark --cov-report=term-missing"
