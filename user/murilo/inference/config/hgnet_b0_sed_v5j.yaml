# SED inference: HGNetV2-B0 + LSEHead (v5j single-fold, 0.906 LB)
#
# Extracts: clip-level embeddings (1024-dim), clipwise logits (234),
# framewise logits (T × 234) from all train_audio and train_soundscapes.

run_name: "hgnet-b0-sed-v5j"
dataset_name: "birdclef-2026"
model_type: "sed"

encoder:
  type: "efficientnet"
  model_name: "hgnetv2_b0.ssld_stage2_ft_in1k"
  pretrained: false
  embed_dim: 1024

sed_head:
  type: "lse_head"
  hidden_dim: 1024
  dropout: 0.5
  gem_p: 3.0
  lse_temperature: 1.0
  freq_pool: "mean"

mel:
  n_fft: 2048
  hop_length: 313
  n_mels: 256
  fmax: null
  top_db: 80.0
  norm_type: "amplitude_to_db"

model:
  checkpoint_path: "/storage/project/ps-clef2026_birdclef-0/mgustineli3/experiments/017-mel-overhaul/checkpoints/2026-hgnet-b0-sed-v5j/best-epochepoch=19.ckpt"
  num_classes: 234

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  chunk_duration: 5.0
  batch_size: 64
  num_workers: 8
