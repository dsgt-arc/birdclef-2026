# SED inference: HGNetV2-B0 + LSEHead (v5j-pl-v1, exp 025 round 1 pseudo-label student)
#
# Same architecture as v5j baseline but trained on focal + labeled soundscapes +
# pseudo-labeled soundscapes (347K PLs, 50/50 batch mixing, w=0.5).
# LB: 0.897 (regressed from 0.903 baseline — diagnosis needed).

run_name: "hgnet-b0-sed-v5j-pl-v1"
dataset_name: "birdclef-2026"
model_type: "sed"

encoder:
  type: "efficientnet"
  model_name: "hgnetv2_b0.ssld_stage2_ft_in1k"
  pretrained: false
  embed_dim: 1024

sed_head:
  type: "lse_head"
  hidden_dim: 1024
  dropout: 0.5
  gem_p: 3.0
  lse_temperature: 1.0
  freq_pool: "mean"

mel:
  n_fft: 2048
  hop_length: 313
  n_mels: 256
  fmax: null
  top_db: 80.0
  norm_type: "amplitude_to_db"

model:
  checkpoint_path: "/storage/project/ps-clef2026_birdclef-0/mgustineli3/experiments/025-iter-pseudo-labeling/checkpoints/2026-exp025-v1-pl-round1/best-epochepoch=18.ckpt"
  num_classes: 234

data:
  data_dir: "/storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026"
  sample_rate: 32000
  chunk_duration: 5.0
  batch_size: 64
  num_workers: 8
