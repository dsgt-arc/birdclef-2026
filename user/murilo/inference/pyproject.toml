[project]
name = "birdclef-inference"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchaudio",
    "pytorch-lightning",
    "torchmetrics",
    "timm",
    "nnAudio>=0.3.2",
    "einops",
    "peft>=0.7.0",
    "huggingface-hub",
    "pandas",
    "pyarrow",
    "soundfile",
    "scipy",
    "torchinfo",
    "pyyaml",
    "tqdm",
    "nvidia-ml-py",
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef"]
