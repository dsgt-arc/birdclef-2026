[project]
name = "birdclef-adrian"
version = "0.1.0"
description = "BirdCLEF benchmark experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tensorflow",
    "tensorflow_hub",
    "ai-edge-litert",
    "torch>=2.1",
    "torchaudio>=2.1",
    "transformers>=4.40",
    "numpy>=1.26",
    "pandas",
    "opensoundscape",
    "birdclef-anthony", # Depend on shared code
    "bioacoustics-model-zoo",
]

[tool.uv.sources]
birdclef-anthony = { path = "../anthony", editable = true }
bioacoustics-model-zoo = { path = "../../vendor/bioacoustics-model-zoo", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef_adrian"]
