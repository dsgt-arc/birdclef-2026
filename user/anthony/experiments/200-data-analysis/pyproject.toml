[project]
name = "birdclef-200-data-analysis"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pacmap>=0.8.0",
    "polars>=1.40.1",
    "scikit-learn>=1.3",
]

[project.scripts]
birdclef-200-labeled-soundscapes = "data_analysis.labeled_soundscapes:main"
birdclef-200-pacmap-soundscapes = "data_analysis.pacmap_soundscape_embeddings:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analysis"]
