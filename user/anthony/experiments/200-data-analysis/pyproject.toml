[project]
name = "birdclef-200-data-analysis"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "librosa>=0.11",
    "luigi>=3.5",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pacmap>=0.8.0",
    "pandas>=2.0",
    "polars>=1.40.1",
    "scikit-learn>=1.3",
    "scikit-maad>=1.5.2",
    "scipy>=1.11",
    "soundfile>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analysis"]
