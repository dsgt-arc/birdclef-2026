[project]
name = "exp106-perch-bayesian"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "soundfile>=0.12",
    "polars>=1.0",
    "onnxruntime>=1.18",
    "huggingface_hub>=0.23",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "luigi>=3.5",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "pydmd>=1.0",
    "filterpy>=1.4",
    "igraph>=0.11",
    "leidenalg>=0.10",
]

[project.scripts]
birdclef-106 = "birdclef_106.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef_106"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
