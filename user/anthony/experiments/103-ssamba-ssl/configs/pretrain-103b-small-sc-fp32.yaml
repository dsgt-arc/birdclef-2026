model:
  embed_dim: 384
  depth: 24
  img_size: [256, 3072]
  patch_size: [16, 16]
  mel_norm: amplitude_to_db
  mask_ratio: 0.40
  mask_mode: random
  grid_jitter: 5
  normalize_targets: true
  loss_fn: mse
  decoder_depth: 2
  nce_weight: 1.0
  mse_weight: 10.0
  nce_pool: token
  nce_num_negatives: 512

data:
  soundscape_dir: /storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026/train_soundscapes/
  # No focal_dir — soundscapes only (full 30s, no padding)
  sample_rate: 32000
  chunk_duration: 30.0
  n_mels: 256
  n_fft: 4096
  win_length: 4096
  hop_length: 320
  fmin: 50
  fmax: 16000
  target_frames: 3072
  batch_size: 4
  num_workers: 6
  val_fraction: 0.05

training:
  max_epochs: 15
  lr: 1.5e-4
  weight_decay: 0.05
  warmup_epochs: 2
  precision: 32-true
  accumulate_grad_batches: 8
