[project]
name = "exp107-hopfield-prototypes"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "einops>=0.8",
    "polars>=1.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "exp106-perch-bayesian",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
exp106-perch-bayesian = { path = "../106-perch-bayesian", editable = true }

[project.scripts]
birdclef-107 = "birdclef_107.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef_107"]

# Bundle the families.csv asset (iNat-derived species → family mapping)
# so wheel installs carry it alongside the Python modules. Editable
# installs find it via DEFAULT_FAMILIES_CSV regardless of this setting.
[tool.hatch.build.targets.wheel.force-include]
"src/birdclef_107/assets/families.csv" = "birdclef_107/assets/families.csv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
