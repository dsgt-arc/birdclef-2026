[project]
name = "exp100-eda"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "luigi>=3.0",
    "polars>=1.0",
    "pyarrow>=14.0",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
eda-pipeline = "eda_100.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eda_100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
