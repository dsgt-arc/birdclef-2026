model:
  embed_dim: 384
  depth: 24
  img_size: [128, 1000]    # 10s @ 100Hz
  patch_size: [128, 1]     # framelevel tokenizer → 1000 tokens
  drop_path_rate: 0.2
  head_dropout: 0.3

data:
  dataset_name: HSN
  sample_rate: 32000
  chunk_duration: 10.0     # 10s chunks (streaming)
  n_mels: 128
  target_frames: 1000      # 10s @ 100Hz
  batch_size: 32
  num_workers: 8
  norm_mean: -4.268        # AudioSet normalization (verify with nnAudio output)
  norm_std: 4.569

training:
  max_epochs: 100
  lr: 1.0e-4
  weight_decay: 0.05
  warmup_epochs: 5
  threshold: 0.5
  grad_clip_val: 1.0
  precision: bf16-mixed
  freeze_epochs: 5
  alpha: 1.0              # SED loss weight
  gamma_clip: 2.0         # focal gamma for clip loss (0 = plain BCE)
  gamma_sed: 2.0          # focal gamma for SED loss

augmentation:
  freq_mask_param: 20
  time_mask_param: 100
  num_freq_masks: 2
  num_time_masks: 2

callbacks:
  early_stopping: { monitor: val/cmap, mode: max, patience: 15, min_delta: 0.001 }
  model_checkpoint: { monitor: val/cmap, mode: max, save_top_k: 1, save_last: true }
