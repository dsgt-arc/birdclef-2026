[project]
name = "exp008-attention-pooled-sed"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "ssamba-hf",
    "nnAudio>=0.3",
    "datasets>=3.6.0,<4",
    "torchmetrics>=1.0.0",
    "pytorch-lightning>=2.0",
    "torchaudio>=2.1",
    "torch>=2.1",
    "soundfile>=0.12",
    "tensorboard>=2.14",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
ssamba-hf = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
