[project]
name = "ssamba-hf"
version = "0.1.0"
description = "Pure PyTorch SSAMBA using HuggingFace transformers MambaMixer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "timm>=1.0.0",
    "einops>=0.8.0",
    "torchaudio>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ipython>=8.0.0",
]
peft = [
    "peft>=0.10.0",
]
