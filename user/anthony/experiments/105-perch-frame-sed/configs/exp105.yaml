# Experiment 105: Perch pooled-embedding head, phase 1 (linear probe).
# Hyperparameters mirror exp 102 Run N (configs/run-n-sed-frozen.yaml).

data:
  sample_rate: 32000
  chunk_duration: 5.0
  window_samples: 160000
  soundscape_dir: /storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026/train_soundscapes/
  soundscape_labels_csv: /storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026/train_soundscapes_labels.csv
  train_csv: /storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026/train.csv
  nocall_parquet: ../102-efficientnet-sed/artifacts/nocall_index.parquet
  split_seed: 42

focal:
  audio_dir: /storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026/train_audio/
  val_fraction: 0.1
  num_shards: 8

extract:
  # Also request spatial_embedding ([16, 4, 1536]) alongside pooled embedding.
  # Costs ~16× the disk of pooled alone, but zero extra Perch compute (both
  # tensors come out of the same forward pass). Saves re-extracting for phase 2.
  frame_features: true
  # Also capture Perch's classifier logits ('label' output, 14795-d over
  # Xeno-canto taxonomy). Free from the same forward pass, ~7 GB disk for
  # the full focal set. Enables zero-shot baseline, logit-feature concatenation,
  # teacher distillation, and amphibian-coverage diagnostics.
  capture_perch_logits: true

perch:
  hf_repo: justinchuby/Perch-onnx
  hf_filename: perch_v2_no_dft.onnx
  batch_size: 32

cache:
  # Scratch — ~48 GB focal frame-feature cache lives here, auto-purged after
  # inactivity. Not project/shared because size + regenerability.
  output_dir: /storage/home/hcoda1/8/amiyaguchi3/scratch/birdclef-2026/features/perch_v2/
  pilot_dir: artifacts/features_pilot/

training:
  batch_size: 256
  max_epochs: 50
  lr: 1.0e-3
  weight_decay: 0.01
  warmup_epochs: 3
  gamma: 2.0
  clipwise_weight: 0.5
  framewise_weight: 0.5
  precision: 32
  early_stopping:
    monitor: val/cmap
    mode: max
    patience: 10

model:
  linear:
    # No hyperparameters — just nn.Linear(1536, num_classes)
  mlp:
    hidden_dim: 512
    dropout: 0.2
  sed:
    hidden_dim: 512
    dropout: 0.5
    gem_p: 3.0
    blend_clip: 0.75
    blend_frame: 0.25
