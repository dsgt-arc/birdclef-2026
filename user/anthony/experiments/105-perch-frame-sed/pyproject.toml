[project]
name = "exp105-perch-sed"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "soundfile>=0.12",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pytorch-lightning>=2.0",
    "torchmetrics>=1.0",
    "onnxruntime>=1.18",
    "huggingface_hub>=0.23",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.scripts]
birdclef-105 = "birdclef_105.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef_105"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
