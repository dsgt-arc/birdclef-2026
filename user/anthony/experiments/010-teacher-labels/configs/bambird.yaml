# bambird config for BirdCLEF 2025 teacher label extraction
# Based on vendor/bambird/config_default.yaml

RANDOM_SEED: 1979

# Not used — bambird.load_config() requires this key
PARAMS_XC:
  NUM_FILES: 20
  PARAM_XC_LIST: []
  CSV_XC_FILE: 'xc_metadata.csv'

PARAMS_EXTRACT:
  FUNC: !FUNC bambird.extract_rois_full_sig
  SAMPLE_RATE: 48000
  LOW_FREQ: 250
  HIGH_FREQ: 12000
  BUTTER_ORDER: 1
  AUDIO_DURATION: 60
  CHUNK_DURATION: 10
  OVLP: 0.5
  MODE_RMBCKG: median
  NFFT: 1024
  N_RUNNING_MEAN: 10
  MASK_PARAM1: 26
  MASK_PARAM2: 10
  MAX_RATIO_YX: 7
  MIN_DURATION: 0.1
  MARGIN_T_LEFT: 0.2
  MARGIN_T_RIGHT: 0.2
  MARGIN_F_BOTTOM: 250
  MARGIN_F_TOP: 250
  MARGIN_T: 0.1
  MARGIN_F: 250
  FILTER_ORDER: 5

PARAMS_FEATURES:
  SAMPLE_RATE: 48000
  LOW_FREQ: 250
  HIGH_FREQ: 12000
  BUTTER_ORDER: 5
  NFFT: 1024
  SHAPE_RES: 'high'

PARAMS_CLUSTER:
  FEATURES: ['shp', 'centroid_f', 'peak_f', 'duration_t', 'bandwidth_f', 'bandwidth_min_f', 'bandwidth_max_f']
  SCALER: MINMAXSCALER
  PERCENTAGE_PTS: 5
  MIN_PTS:
  EPS: auto
  METHOD: DBSCAN
  KEEP: BIGGEST
