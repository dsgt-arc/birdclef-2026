[project]
name = "exp013-weak-supervision-flyingsquid"
version = "0.1.0"
description = "Weak supervision label fusion with FlyingSquid triplet method"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "lightning>=2.0",
    "torchmetrics>=1.0",
    "scikit-learn>=1.3",
    "polars>=1.0",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "typer>=0.9",
    "rich>=13.0",
]

[project.scripts]
weaksup-probe = "weaksup.linear_probe:app"
weaksup-fuse = "weaksup.fuse:app"
weaksup-evaluate = "weaksup.evaluate:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weaksup"]
