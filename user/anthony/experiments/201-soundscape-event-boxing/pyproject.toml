[project]
name = "birdclef-201-soundscape-event-boxing"
version = "0.1.0"
description = "Weak->strong label upgrading: time-frequency event boxes on BirdCLEF 2026 soundscapes, insects first."
requires-python = ">=3.11,<3.13"
dependencies = [
    "librosa>=0.11",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "polars>=1.40.1",
    "scikit-maad>=1.5.2",
    "scipy>=1.11",
    "soundfile>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef_201"]
