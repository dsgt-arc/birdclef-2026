[project]
name = "exp300-cross-encoder-transfer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "transformers>=4.40",
    "peft>=0.10",
    "soundfile>=0.12",
    "polars>=1.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "luigi>=3.5",
    "scikit-learn>=1.4",
    "scipy>=1.12",
]

# The shared `birdclef` encoder library (package birdclef-anthony) and the
# SSAMBA-HF port are installed editable in sbatch/_setup-venv.sh — they are not
# on PyPI and uv workspace refs only resolve inside the workspace. See exp 103
# pyproject for the same convention.

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
birdclef-300 = "birdclef_300.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef_300"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
