[project]
name = "exp102-efficientnet-lora"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.40",
    "peft>=0.10",
    "nnAudio>=0.3",
    "pytorch-lightning>=2.0",
    "torchmetrics>=1.0",
    "torch>=2.1",
    "torchaudio>=2.1",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "pynvml>=11.5",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.scripts]
birdclef-efficientnet = "birdclef_102.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef_102"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
