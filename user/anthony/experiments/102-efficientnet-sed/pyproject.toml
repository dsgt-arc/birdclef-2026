[project]
name = "exp102-efficientnet-lora"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "exp009-birdclef-pipeline",
    "transformers>=4.40",
    "peft>=0.10",
    "nnAudio>=0.3",
    "pytorch-lightning>=2.0",
    "torch>=2.1",
    "pyyaml>=6.0",
    "pynvml>=11.5",
]

[project.scripts]
birdclef-efficientnet = "birdclef_102.cli:main"

[tool.uv.sources]
exp009-birdclef-pipeline = { path = "../../009-birdclef-pipeline", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef_102"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
