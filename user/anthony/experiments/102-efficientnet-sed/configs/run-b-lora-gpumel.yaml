# Run B variant: EfficientNet-B1 LoRA with GPU mel + fp16 + compile

model:
  model_name: "DBD-research-group/EfficientNet-B1-BirdSet-XCL"
  backbone_mode: lora
  head_dropout: 0.3

lora:
  rank: 8
  alpha: 16
  dropout: 0.1

data:
  audio_dir: /storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026/train_audio/
  metadata_csv: /storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026/train.csv
  sample_rate: 32000
  chunk_duration: 5.0
  n_mels: 256
  n_fft: 2048
  hop_length: 256
  target_frames: 625
  # mel_on_cpu: false (default) — GPU mel with fp32 autocast wrapper
  batch_size: 32        # EfficientNet LoRA backprop is memory-hungry
  num_workers: 6
  val_fraction: 0.1
  activity_parquet: artifacts/focal_activity.parquet

training:
  max_epochs: 50
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_epochs: 3
  compile: true
  precision: 16-mixed
  gamma: 2.0
  augmentation:
    freq_mask_param: 40
    time_mask_param: 50
    num_freq_masks: 2
    num_time_masks: 2

callbacks:
  early_stopping: { monitor: val/cmap, mode: max, patience: 10 }
  model_checkpoint: { monitor: val/cmap, mode: max, save_top_k: 1 }
