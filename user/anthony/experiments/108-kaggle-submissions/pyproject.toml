[project]
name = "exp108-kaggle-submissions"
version = "0.1.0"
description = "Shared Kaggle inference module + per-model submission kernels for BirdCLEF 2026"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "polars>=1.0",
    "soundfile>=0.12",
    "onnxruntime>=1.17",
    "huggingface_hub>=0.20",
    "torch>=2.1",
    "exp106-perch-bayesian",
    "exp107-hopfield-prototypes",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
exp106-perch-bayesian = { path = "../106-perch-bayesian", editable = true }
exp107-hopfield-prototypes = { path = "../107-hopfield-prototypes", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef_kaggle"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
