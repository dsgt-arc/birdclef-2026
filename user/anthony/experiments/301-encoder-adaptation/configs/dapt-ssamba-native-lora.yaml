# SSAMBA native DAPT (masked-spectrogram MPG/MPC) — LoRA arm.
# Freezes the base; trains LoRA adapters on the Mamba [in_proj, out_proj] against the
# native masked loss (regularizes against catastrophic forgetting). After training:
#   birdclef-300 extract --encoder ssamba_hf --variant dapt-native-lora-ep1 --adapter <out>/adapter
encoder: ssamba_hf
variant: dapt-native-lora-ep1
peft: lora

encoder_cfg:
  checkpoint: ~/scratch/birdclef-2026/checkpoints/ssamba/ssamba_small_400.pth
  model_size: small
  input_tdim: 512
  device: cuda

lora:
  rank: 8
  alpha: 16
  dropout: 0.1
  target_modules: [in_proj, out_proj]

dapt:
  mask_ratio: 0.4
  mask_mode: span
  mask_span_min: 5
  mask_span_max: 15
  normalize_targets: true
  decoder_depth: 2
  mse_weight: 10.0
  nce_weight: 1.0
  nce_temperature: 0.1
  nce_num_negatives: 100

data:
  soundscape_dir: /storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026/train_soundscapes/

training:
  epochs: 1
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  num_workers: 4
  seed: 42
