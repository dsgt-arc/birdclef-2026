# Supervised-focal LoRA adaptation of SSAMBA-HF.
# After training, re-extract with:
#   birdclef-300 extract --encoder ssamba_hf --variant lora-r8 --adapter <output-dir>/adapter
encoder: ssamba_hf
variant: lora-r8

encoder_cfg:
  checkpoint: ~/scratch/birdclef-2026/checkpoints/ssamba/ssamba_small_400.pth
  model_size: small
  input_tdim: 512
  device: cuda

lora:
  rank: 8
  alpha: 16
  dropout: 0.1
  target_modules: [in_proj, out_proj]   # Mamba block projections (shared MODEL_CONFIGS["ssamba-hf"])

data:
  train_csv: /storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026/train.csv
  audio_dir: /storage/project/ps-clef2026_birdclef-0/shared/data/birdclef-2026/train_audio/

training:
  epochs: 5
  batch_size: 16
  lr: 1.0e-4
  focal_gamma: 2.0
  max_grad_norm: 1.0
  num_workers: 4
