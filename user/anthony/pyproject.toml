[project]
name = "birdclef-anthony"
version = "0.1.0"
description = "BirdCLEF encoder benchmarking and audio classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "transformers>=4.40",
    "peft>=0.10",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "soundfile>=0.12",
    "timm>=0.9",
    "omegaconf>=2.0",
    "tqdm",
    "pandas",
    "onnxruntime>=1.17",
    "onnx>=1.15",
    "onnxscript>=0.1",
    "faiss-cpu>=1.7",
    "webdataset>=0.2",
    "pytorch-lightning>=2.0",
    "psutil>=5.9",
    "tensorboard>=2.14",
    "safetensors>=0.4",
    "mamba-onnx>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "playwright",
    "py-spy",
]
cuda = [
    "causal-conv1d>=1.4.0",  # Required by mamba-ssm for CUDA kernels
    "mamba-ssm>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef"]

[tool.uv.workspace]
members = [
    "experiments/004-ssamba-hf-port/ssamba_hf",
    "experiments/006-ssamba-birdset-hsn",
    "experiments/007-pretrained-ssamba-transfer",
]

# Use PyTorch cu121 index for CUDA 12.1 compatibility (matches PACE's cuda/12.1.1 module)
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
# Pre-built wheels from GitHub releases (matched to torch 2.5 + cu12 + cp311)
# These have correct PyTorch ABI, unlike PyPI source distributions
causal-conv1d = { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.6.0/causal_conv1d-1.6.0+cu12torch2.5cxx11abiFALSE-cp311-cp311-linux_x86_64.whl" }
mamba-ssm = { url = "https://github.com/state-spaces/mamba/releases/download/v2.3.0/mamba_ssm-2.3.0+cu12torch2.5cxx11abiFALSE-cp311-cp311-linux_x86_64.whl" }
# Pre-built mamba-onnx wheel with AVX2 custom ops for ONNX Runtime CPU inference
mamba-onnx = { url = "https://github.com/acmiyaguchi/mamba-onnx/releases/latest/download/mamba_onnx-0.1.0-py3-none-manylinux_2_17_x86_64.whl" }
