[project]
name = "birdclef-anthony"
version = "0.1.0"
description = "BirdCLEF encoder benchmarking and audio classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "transformers>=4.40",
    "peft>=0.10",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "soundfile>=0.12",
    "timm>=0.9",
    "omegaconf>=2.0",
    "tqdm",
    "pandas",
    "onnxruntime>=1.17",
    "onnx>=1.15",
    "onnxscript>=0.1",
    "faiss-cpu>=1.7",
    "webdataset>=0.2",
    "pytorch-lightning>=2.0",
    "psutil>=5.9",
    "tensorboard>=2.14",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "playwright",
    "py-spy",
]
cuda = [
    "mamba-ssm>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef"]

[tool.uv.workspace]
members = [
    "experiments/004-ssamba-hf-port/ssamba_hf",
]

# Use PyTorch cu121 index for CUDA 12.1 compatibility (matches PACE's cuda/12.1.1 module)
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
