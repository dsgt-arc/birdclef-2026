[project]
name = "birdclef-anthony"
version = "0.1.0"
description = "BirdCLEF encoder benchmarking and audio classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "transformers>=4.40",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "soundfile>=0.12",
    "timm>=0.9",
    "omegaconf>=2.0",
    "tqdm",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef"]
